<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시간유적 - Three.js Prototype</title>

    <style>
        /* ================================================================
           시간유적 — 1997년식 한국사 CD-ROM 게임 UI
           금속판 / 황동 테두리 / CRT / 낡은 인쇄물 느낌
           ================================================================ */
        :root {
            --brass: #c09354;
            --brass-hi: #e8c489;
            --brass-lo: #6d4e24;
            --ink: #efd6a2;
            --ink-dim: #bb9a68;
            --plate-hi: rgba(62, 41, 23, 0.72);
            --plate-lo: rgba(21, 14, 9, 0.78);
            /* 낡은 금속판 모서리를 살짝 깎아낸 형태 (둥근 모서리 대신) */
            --notch: polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #070504;
            font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "AppleGothic", sans-serif;
            /* 안티앨리어싱을 끄면 글자도 옛날 PC 게임처럼 거칠어진다 */
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: unset;
            font-smooth: never;
        }

        #game {
            position: fixed;
            inset: 0;
            background: #070504;
        }

        /* 저해상도 캔버스를 화면 크기로 확대 → 굵은 픽셀 */
        /* (#game 안의 WebGL 캔버스에만 적용. 미니맵 캔버스는 제외) */
        #game canvas {
            display: block;
            width: 100vw !important;
            height: 100vh !important;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        /* ---------- CRT 스캔라인 (풀 해상도의 얇은 줄) ---------- */
        #scan {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            opacity: 0.30;
            background: repeating-linear-gradient(to bottom,
                    rgba(0, 0, 0, 0.42) 0px,
                    rgba(0, 0, 0, 0.42) 1px,
                    rgba(255, 245, 225, 0.05) 1px,
                    rgba(255, 245, 225, 0.05) 3px);
        }

        /* ---------- 섀도우 마스크 / 미세한 색 분리 ---------- */
        #mask {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            opacity: 0.12;
            background: repeating-linear-gradient(to right,
                    rgba(255, 90, 60, 0.5) 0px,
                    rgba(90, 255, 120, 0.5) 1px,
                    rgba(80, 120, 255, 0.5) 2px,
                    rgba(0, 0, 0, 0) 3px);
            mix-blend-mode: overlay;
        }

        /* ---------- 비네팅 + CRT 유리 반사 ---------- */
        #vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 6;
            background:
                radial-gradient(ellipse 120% 105% at 50% 46%,
                    rgba(0, 0, 0, 0) 40%,
                    rgba(18, 10, 4, 0.30) 74%,
                    rgba(8, 4, 2, 0.72) 100%),
                radial-gradient(ellipse 60% 42% at 34% 12%,
                    rgba(255, 238, 205, 0.055), rgba(255, 238, 205, 0) 70%);
        }

        /* ---------- 모니터 베젤 안쪽 그림자 ---------- */
        #bezel {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 7;
            box-shadow:
                inset 0 0 70px rgba(0, 0, 0, 0.75),
                inset 0 0 180px rgba(10, 5, 2, 0.45);
        }

        #ui {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            color: var(--ink);
            text-shadow: 1px 1px 0 #170d05, 2px 2px 0 rgba(0, 0, 0, 0.45);
            user-select: none;
        }

        /* ================= 낡은 금속판 패널 ================= */
        .panel {
            position: relative;
            clip-path: var(--notch);
            background:
                /* 긁힌 자국 */
                repeating-linear-gradient(112deg,
                    rgba(255, 226, 180, 0.030) 0 1px,
                    rgba(0, 0, 0, 0.055) 1px 4px),
                /* 얼룩 */
                radial-gradient(ellipse at 22% 18%, rgba(129, 90, 45, 0.42), rgba(0, 0, 0, 0) 62%),
                radial-gradient(ellipse at 84% 88%, rgba(84, 52, 24, 0.38), rgba(0, 0, 0, 0) 58%),
                linear-gradient(168deg, var(--plate-hi), var(--plate-lo));
            box-shadow:
                inset 0 0 0 1px rgba(15, 9, 4, 0.9),
                inset 0 0 26px rgba(0, 0, 0, 0.70),
                inset 0 1px 0 rgba(224, 186, 129, 0.10);
        }

        /* 황동 테두리 (안쪽으로 한 겹 더) */
        .panel::before {
            content: "";
            position: absolute;
            inset: 3px;
            clip-path: var(--notch);
            border: 1px solid var(--brass);
            box-shadow:
                inset 0 0 0 1px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(0, 0, 0, 0.5);
            opacity: 0.82;
            pointer-events: none;
        }

        /* 깎인 모서리를 채우는 황동 사선 */
        .panel::after {
            content: "";
            position: absolute;
            left: -2px;
            top: -2px;
            width: 17px;
            height: 17px;
            background: linear-gradient(45deg, var(--brass) 0 1.5px, rgba(0, 0, 0, 0) 1.5px);
            transform: rotate(0deg);
            opacity: 0.7;
            pointer-events: none;
        }

        /* ================= 좌측 상단 ================= */
        #topLeft {
            position: absolute;
            left: 16px;
            top: 16px;
            width: 372px;
            padding: 13px 17px 14px;
        }

        #title {
            font-size: 31px;
            line-height: 1.05;
            font-weight: 900;
            letter-spacing: 5px;
            color: #ffdf9e;
            margin-bottom: 9px;
            text-shadow:
                1px 1px 0 #180d04,
                2px 2px 0 #2c180a,
                0 0 14px rgba(196, 136, 54, 0.45);
        }

        /* 제목 아래 황동 구분선 */
        #titleRule {
            height: 2px;
            margin: 0 0 9px;
            background: linear-gradient(to right,
                    rgba(214, 166, 96, 0.85),
                    rgba(214, 166, 96, 0.22) 72%,
                    rgba(214, 166, 96, 0));
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
        }

        .stat {
            font-size: 13.5px;
            line-height: 1.62;
            color: var(--ink-dim);
        }

        .stat b {
            color: #f5cd7e;
            font-weight: 700;
        }

        /* ================= 우측 상단 조작 안내 ================= */
        #controls {
            position: absolute;
            right: 16px;
            top: 16px;
            padding: 11px 15px;
            font-size: 12.5px;
            line-height: 1.62;
            color: var(--ink-dim);
            text-align: right;
        }

        /* ================= 미니맵 ================= */
        #minimapPanel {
            position: absolute;
            right: 16px;
            top: 120px;
            padding: 9px;
        }

        #minimap {
            display: block;
            width: 146px;
            height: 146px;
            image-rendering: pixelated;
            background: rgba(12, 8, 5, 0.55);
            box-shadow: inset 0 0 0 1px rgba(10, 6, 3, 0.9);
        }

        #minimapLabel {
            margin-top: 6px;
            font-size: 10px;
            letter-spacing: 3px;
            text-align: center;
            color: #b08c4e;
        }

        /* ================= 힌트 / 이정표 ================= */
        #hintBtn {
            position: absolute;
            right: 16px;
            top: 308px;
            width: 164px;
            box-sizing: border-box;
            padding: 8px 10px;
            font-size: 12px;
            letter-spacing: 1px;
            text-align: center;
            color: #e6c88d;
            cursor: pointer;
            pointer-events: auto;
            transition: color 120ms steps(2, end);
        }

        #hintBtn:hover {
            color: #ffe2a3;
        }

        #hintBtn.on {
            color: #ffd071;
        }

        /* 화면 하단의 작은 나무 이정표 표시 */
        #signpost {
            position: absolute;
            left: 50%;
            bottom: 148px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 18px 9px 14px;
            font-size: 12.5px;
            color: #f0d49a;
            opacity: 0;
            transition: opacity 260ms steps(3, end);
        }

        #signpost.show {
            opacity: 1;
        }

        /* 목표 방향을 가리키는 화살표 (CSS 삼각형) */
        #signArrow {
            width: 0;
            height: 0;
            border-left: 9px solid transparent;
            border-right: 9px solid transparent;
            border-bottom: 17px solid #e9b653;
            filter: drop-shadow(1px 1px 0 #2a1608);
            transform-origin: 50% 65%;
        }

        #signText b {
            color: #ffd071;
        }

        #signDist {
            color: #b8934f;
            font-size: 11px;
        }

        /* ================= [E] 조사 프롬프트 ================= */
        #prompt {
            position: absolute;
            left: 50%;
            top: 56%;
            transform: translate(-50%, -50%);
            padding: 5px 13px;
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: 700;
            color: #ffeaae;
            background: linear-gradient(180deg, rgba(48, 31, 16, 0.92), rgba(20, 13, 7, 0.94));
            border: 1px solid var(--brass);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.7), 0 0 12px rgba(0, 0, 0, 0.6);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            transition: opacity 110ms steps(3, end);
            animation: promptPulse 1.6s steps(2, end) infinite;
        }

        @keyframes promptPulse {

            0%,
            100% {
                color: #ffeaae;
            }

            50% {
                color: #ffc457;
            }
        }

        #prompt.hidden {
            opacity: 0;
        }

        /* ================= 하단 메시지 창 ================= */
        #message {
            /* 가장 넓은 패널이라 더 투명하게 — 뒤 풍경이 비친다 */
            --plate-hi: rgba(58, 38, 21, 0.60);
            --plate-lo: rgba(18, 12, 8, 0.68);
            backdrop-filter: blur(1px);
            position: absolute;
            left: 50%;
            bottom: 88px;
            transform: translateX(-50%);
            width: min(820px, calc(100vw - 56px));
            min-height: 40px;
            padding: 11px 20px;
            font-size: 13.5px;
            line-height: 1.58;
            color: #f3d9a4;
            white-space: pre-line;
        }

        /* ================= 인벤토리 ================= */
        #inventory {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            display: flex;
            gap: 9px;
            align-items: center;
        }

        .slot {
            position: relative;
            width: 118px;
            height: 44px;
            padding: 5px 7px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 12px;
            line-height: 1.2;
            color: #9e8355;
            clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
            background:
                repeating-linear-gradient(112deg, rgba(255, 226, 180, 0.025) 0 1px, rgba(0, 0, 0, 0.06) 1px 4px),
                linear-gradient(168deg, rgba(44, 29, 17, 0.62), rgba(15, 10, 7, 0.72));
            box-shadow:
                inset 0 0 0 1px rgba(10, 6, 3, 0.9),
                inset 0 0 18px rgba(0, 0, 0, 0.8);
        }

        .slot::before {
            content: "";
            position: absolute;
            inset: 3px;
            clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
            border: 1px solid rgba(150, 110, 56, 0.55);
            pointer-events: none;
        }

        .slot.filled {
            color: #ffdf9f;
            background:
                repeating-linear-gradient(112deg, rgba(255, 226, 180, 0.04) 0 1px, rgba(0, 0, 0, 0.05) 1px 4px),
                linear-gradient(168deg, rgba(92, 60, 28, 0.70), rgba(35, 23, 14, 0.78));
            box-shadow:
                inset 0 0 0 1px rgba(10, 6, 3, 0.9),
                inset 0 0 16px rgba(0, 0, 0, 0.55),
                0 0 12px rgba(160, 110, 45, 0.3);
        }

        .slot.filled::before {
            border-color: var(--brass-hi);
        }

        /* ================= 시대 전환 연출 ================= */
        #flash {
            position: fixed;
            inset: 0;
            z-index: 25;
            pointer-events: none;
            background: #fff6e2;
            opacity: 0;
            mix-blend-mode: screen;
        }

        #flash.play {
            animation: whiteFlash 1000ms steps(6, end) forwards;
        }

        @keyframes whiteFlash {
            0% {
                opacity: 0;
            }

            8% {
                opacity: 0.95;
            }

            16% {
                opacity: 0.12;
            }

            27% {
                opacity: 0.80;
            }

            43% {
                opacity: 0.20;
            }

            62% {
                opacity: 0.35;
            }

            100% {
                opacity: 0;
            }
        }

        #glitch {
            position: fixed;
            inset: 0;
            z-index: 26;
            pointer-events: none;
            opacity: 0;
            background:
                repeating-linear-gradient(to bottom,
                    rgba(180, 210, 255, 0.16) 0 3px,
                    rgba(255, 150, 120, 0.13) 3px 7px,
                    rgba(0, 0, 0, 0) 7px 14px);
            mix-blend-mode: screen;
        }

        #glitch.play {
            animation: glitchMove 1000ms steps(11, end) forwards;
        }

        @keyframes glitchMove {
            0% {
                opacity: 0;
                transform: translate(0, 0) scaleY(1);
            }

            10% {
                opacity: .85;
                transform: translate(-9px, 3px) scaleY(1.03);
            }

            20% {
                opacity: .25;
                transform: translate(8px, -5px) scaleY(0.97);
            }

            35% {
                opacity: .75;
                transform: translate(-5px, -2px) scaleY(1.05);
            }

            55% {
                opacity: .35;
                transform: translate(6px, 4px) scaleY(0.98);
            }

            78% {
                opacity: .5;
                transform: translate(-3px, 1px) scaleY(1.01);
            }

            100% {
                opacity: 0;
                transform: translate(0, 0) scaleY(1);
            }
        }

        /* ================= 데모 완료 ================= */
        #completeOverlay {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 900ms ease;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.82));
        }

        #completeOverlay.show {
            opacity: 1;
        }

        #completeBox {
            width: min(600px, calc(100vw - 48px));
            padding: 34px 36px;
            text-align: center;
            color: #f3d9a4;
        }

        #completeBox h1 {
            margin: 0 0 6px;
            font-size: 36px;
            font-weight: 900;
            color: #ffdf9e;
            letter-spacing: 8px;
        }

        #completeBox .sub {
            font-size: 12px;
            letter-spacing: 6px;
            color: #b8934f;
            margin-bottom: 18px;
        }

        #completeBox p {
            margin: 0;
            font-size: 15px;
            line-height: 1.85;
            white-space: pre-line;
        }
    </style>
</head>

<body>
    <div id="game"></div>

    <!-- CRT / 오래된 모니터 오버레이 (전부 CSS, 외부 이미지 없음) -->
    <div id="scan"></div>
    <div id="mask"></div>
    <div id="vignette"></div>
    <div id="bezel"></div>

    <div id="ui">
        <!-- 좌측 상단: 시대 / 목표 / 진행 -->
        <div id="topLeft" class="panel">
            <div id="title">시간유적</div>
            <div id="titleRule"></div>
            <div class="stat">현재 시대: <b id="eraText">-</b></div>
            <div class="stat">현재 목표: <b id="objectiveText">-</b></div>
            <div class="stat">조사 진행: <b id="countText">0 / 0</b></div>
        </div>

        <!-- 우측 상단: 조작 안내 -->
        <div id="controls" class="panel">
            WASD / 방향키: 이동<br>
            Shift: 달리기<br>
            E: 조사 / 획득 / 사용<br>
            H: 이정표 (방향 안내)<br>
            마우스 클릭: 이동
        </div>

        <!-- 미니맵: 등각 화면과 같은 방향으로 회전해서 그린다 -->
        <div id="minimapPanel" class="panel">
            <canvas id="minimap" width="146" height="146"></canvas>
            <div id="minimapLabel">주 변 지 도</div>
        </div>

        <!-- 힌트 버튼: 누르면 목표 방향 이정표가 나타난다 -->
        <div id="hintBtn" class="panel">[H] 이정표</div>

        <!-- 목표 방향 표시 -->
        <div id="signpost" class="panel">
            <div id="signArrow"></div>
            <div>
                <div id="signText">-</div>
                <div id="signDist">-</div>
            </div>
        </div>

        <div id="prompt" class="hidden">[E] 조사</div>
        <div id="message" class="panel">불러오는 중...</div>

        <!-- 유물 5칸 -->
        <div id="inventory">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <div id="flash"></div>
    <div id="glitch"></div>

    <div id="completeOverlay">
        <div id="completeBox" class="panel">
            <h1>시간유적</h1>
            <div class="sub">DEMO COMPLETE</div>
            <p>모든 흔적을 조사했습니다.

잊혀진 시대의 기록이
다시 이어졌습니다.</p>
        </div>
    </div>

    <!-- Three.js CDN만 사용 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        (() => {
            "use strict";

            /******************************************************************
             * 기본 상태값
             ******************************************************************/
            const dom = {
                game: document.getElementById("game"),
                eraText: document.getElementById("eraText"),
                objectiveText: document.getElementById("objectiveText"),
                countText: document.getElementById("countText"),
                prompt: document.getElementById("prompt"),
                message: document.getElementById("message"),
                slots: [...document.querySelectorAll(".slot")],
                flash: document.getElementById("flash"),
                glitch: document.getElementById("glitch"),
                completeOverlay: document.getElementById("completeOverlay"),
                minimap: document.getElementById("minimap"),
                hintBtn: document.getElementById("hintBtn"),
                signpost: document.getElementById("signpost"),
                signArrow: document.getElementById("signArrow"),
                signText: document.getElementById("signText"),
                signDist: document.getElementById("signDist")
            };

            const VIEW_SIZE = 27.5;  // 등각 시야 크기. 클수록 더 넓은 풍경이 보인다.
            const RENDER_SCALE = 0.48; // 내부 렌더 해상도 배율. 낮출수록 픽셀이 굵어진다.
            const PLAYER_SPEED = 4.1;
            const SPRINT_MULTIPLIER = 1.9;  // Shift 를 누르고 있을 때
            const WORLD_LIMIT = 31;

            /******************************************************************
             * GAME STATE / 시대 정의
             *
             * 시대별 색·조명·안개·배경 능선·컬러 그레이딩을 여기서 전부 조정한다.
             * 오브젝트 배치는 각 build<시대>() 함수에 있다.
             ******************************************************************/
            const AGE_DATA = [
                // ---------------------------------------------------------- 신석기
                {
                    name: "신석기 시대 · 한반도 강가 마을",
                    goal: "마을 주변의 유물 3개를 조사하고 회수하세요.",
                    total: 3,
                    start: { x: -7.0, z: 9.0 },

                    fog: 0x7b6343,
                    fogDensity: 0.0135,

                    // 지평선 하늘 그라데이션 (위 -> 아래)
                    sky: { top: 0x4a3a28, mid: 0x8e7148, bottom: 0xd2ad78 },

                    // 멀어질수록 옅어지는 산 능선
                    ridges: [
                        { dist: 74, height: 34, color: 0xa48a63, opacity: 0.55, base: -6 },
                        { dist: 56, height: 25, color: 0x8d7450, opacity: 0.60, base: -5 },
                        { dist: 42, height: 17, color: 0x74603f, opacity: 0.68, base: -4 },
                        { dist: 30, height: 10, color: 0x5e4d33, opacity: 0.75, base: -3 }
                    ],

                    intro: "강가의 얕게 깎인 신석기 마을입니다.\n움집과 갈대밭 사이로 오랜 생활의 흔적이 남아 있습니다.\n주변을 조사해 보세요.",

            /******************************************************************
             * 난수 유틸리티: 장면 장식을 매번 비슷하게 생성하기 위한 간단한 PRNG
             ******************************************************************/
            let rngSeed = 1;

            function seedRandom(seed) {
                rngSeed = seed;
            }

            function rand() {
                const x = Math.sin(rngSeed++) * 10000;
                return x - Math.floor(x);
            }

            function randRange(min, max) {
                return min + rand() * (max - min);
            }

            function pick(arr) {
                return arr[Math.floor(rand() * arr.length)];
            }

            /******************************************************************
             * VALUE NOISE / FBM
             * 지형 굴곡과 수채화풍 얼룩을 만드는 데 사용한다.
             ******************************************************************/
            function hash2(x, y) {
                const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
                return n - Math.floor(n);
            }

            function smooth(t) {
                return t * t * (3 - 2 * t);
            }

            function valueNoise(x, y) {
                const xi = Math.floor(x), yi = Math.floor(y);
                const xf = x - xi, yf = y - yi;
                const u = smooth(xf), v = smooth(yf);

                const a = hash2(xi, yi);
                const b = hash2(xi + 1, yi);
                const c = hash2(xi, yi + 1);
                const d = hash2(xi + 1, yi + 1);

                return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
            }

            function fbm(x, y, octaves = 4) {
                let sum = 0, amp = 0.5, freq = 1, norm = 0;
                for (let i = 0; i < octaves; i++) {
                    sum += valueNoise(x * freq, y * freq) * amp;
                    norm += amp;
                    amp *= 0.5;
                    freq *= 2.05;
                }
                return sum / norm;
            }

            /******************************************************************

             * 멀리 있는 지형이 안개에 녹아들면서 프리렌더 배경처럼 보이게 한다.
             ******************************************************************/
            const TERRAIN = {
                flatRadius: 15,  // 이 반경 안쪽은 평지 (오브젝트 배치가 안정적)
                falloff: 26,     // 이 반경부터 굴곡이 최대
                amplitude: 3.4
            };

            // 시대별 지형 변형 (예: 강바닥 파내기). buildAge 에서 설정한다.
            let terrainCarve = null;

            /** 물속이면 true — 풀/돌/나무를 놓지 않는다 */
            function isUnderwater(x, z) {
                return terrainHeight(x, z) < -0.22;
            }

            /** 물가 근처인지 (나무는 물가에서 조금 떨어져 자란다) */
            function isNearWater(x, z) {
                return isUnderwater(x, z) ||
                    isUnderwater(x + 2.6, z + 2.6) ||
                    isUnderwater(x - 2.6, z - 2.6);
            }

            function terrainHeight(x, z) {
                const d = Math.hypot(x, z);
                let h = 0;

                if (d > TERRAIN.flatRadius) {
                    // 평지 -> 언덕으로 부드럽게 전이
                    let t = (d - TERRAIN.flatRadius) / (TERRAIN.falloff - TERRAIN.flatRadius);
                    t = smooth(THREE.MathUtils.clamp(t, 0, 1));

                    const n = fbm(x * 0.045 + 11.3, z * 0.045 + 7.9, 4) - 0.5;
                    h = n * TERRAIN.amplitude * t;
                }

                return terrainCarve ? terrainCarve(x, z, h) : h;
            }

            /******************************************************************
             * PROCEDURAL TEXTURES
             * 외부 이미지를 쓰지 않고 canvas 로 직접 그린다.
             * 수채화처럼 번진 얼룩 + 거친 종이 결을 섞는다.
             ******************************************************************/
            function makeCanvas(size) {
                const c = document.createElement("canvas");
                c.width = c.height = size;
                return c;
            }

            function finishTexture(canvas, repeat) {
                const t = new THREE.CanvasTexture(canvas);
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.magFilter = THREE.NearestFilter;   // 픽셀 느낌 유지
                t.minFilter = THREE.LinearMipmapLinearFilter;
                t.generateMipmaps = true;
                t.anisotropy = 1;
                if (repeat) t.repeat.set(repeat, repeat);
                if ("colorSpace" in t) t.colorSpace = THREE.SRGBColorSpace;
                return t;
            }

            /**
             * 수채화풍 흙/땅 텍스처.
             * @param {string[]} colors 얼룩에 쓸 색 (CSS 문자열)
             * @param {string} base 바탕색
             */
            function makeTerrainTexture(colors, base, opts = {}) {
                const S = 256;
                const c = makeCanvas(S);
                const g = c.getContext("2d");

                g.fillStyle = base;
                g.fillRect(0, 0, S, S);

                // 1) 크게 번진 수채화 얼룩 (여러 겹 반투명으로 겹쳐 물감처럼)
                const washes = opts.washes ?? 110;
                for (let i = 0; i < washes; i++) {
                    const x = rand() * S, y = rand() * S;
                    const r = randRange(10, 52);
                    const col = pick(colors);
                    const grd = g.createRadialGradient(x, y, 0, x, y, r);
                    grd.addColorStop(0, col.replace("ALPHA", (randRange(0.05, 0.16)).toFixed(3)));
                    grd.addColorStop(0.65, col.replace("ALPHA", (randRange(0.02, 0.07)).toFixed(3)));
                    grd.addColorStop(1, col.replace("ALPHA", "0"));
                    g.fillStyle = grd;
                    g.beginPath();
                    g.arc(x, y, r, 0, Math.PI * 2);
                    g.fill();
                }

                // 2) 마른 붓자국 (수채화 가장자리 느낌)
                g.globalAlpha = 0.10;
                for (let i = 0; i < 26; i++) {
                    g.strokeStyle = pick(colors).replace("ALPHA", "0.5");
                    g.lineWidth = randRange(1, 4);
                    g.beginPath();
                    const x = rand() * S, y = rand() * S;
                    g.moveTo(x, y);
                    g.bezierCurveTo(
                        x + randRange(-40, 40), y + randRange(-40, 40),
                        x + randRange(-60, 60), y + randRange(-60, 60),
                        x + randRange(-70, 70), y + randRange(-70, 70)
                    );
                    g.stroke();
                }
                g.globalAlpha = 1;

                // 3) 자갈/흙알갱이 (픽셀 단위 점묘)
                const img = g.getImageData(0, 0, S, S);
                const d = img.data;
                for (let i = 0; i < d.length; i += 4) {
                    const px = (i / 4) % S, py = Math.floor((i / 4) / S);
                    // 종이 결처럼 저주파 노이즈도 섞는다
                    const paper = (fbm(px * 0.06, py * 0.06, 3) - 0.5) * 26;
                    const speck = (Math.random() - 0.5) * (opts.grit ?? 26);
                    d[i] = THREE.MathUtils.clamp(d[i] + speck + paper, 0, 255);
                    d[i + 1] = THREE.MathUtils.clamp(d[i + 1] + speck * 0.95 + paper, 0, 255);
                    d[i + 2] = THREE.MathUtils.clamp(d[i + 2] + speck * 0.85 + paper * 0.9, 0, 255);
                }
                g.putImageData(img, 0, 0);

                return finishTexture(c, opts.repeat ?? 9);
            }

            /** 물 표면: 잔물결 + 반짝임 */
            function makeWaterTexture(base, hi) {
                const S = 128;
                const c = makeCanvas(S);
                const g = c.getContext("2d");
                g.fillStyle = base;
                g.fillRect(0, 0, S, S);

                for (let i = 0; i < 260; i++) {
                    g.strokeStyle = hi.replace("ALPHA", randRange(0.04, 0.16).toFixed(3));
                    g.lineWidth = randRange(0.6, 1.8);
                    const y = rand() * S, x = rand() * S;
                    const w = randRange(4, 26);
                    g.beginPath();
                    g.moveTo(x, y);
                    g.quadraticCurveTo(x + w * 0.5, y + randRange(-1.6, 1.6), x + w, y);
                    g.stroke();
                }
                return finishTexture(c, 7);
            }

            /** 초가지붕 / 갈대 지붕: 세로 결 */
            function makeThatchTexture(base, dark, light) {
                const S = 128;
                const c = makeCanvas(S);
                const g = c.getContext("2d");
                g.fillStyle = base;
                g.fillRect(0, 0, S, S);

                for (let i = 0; i < 700; i++) {
                    g.strokeStyle = (rand() > 0.5 ? dark : light).replace("ALPHA", randRange(0.08, 0.34).toFixed(3));
                    g.lineWidth = randRange(0.5, 1.6);
                    const x = rand() * S, y = rand() * S;
                    g.beginPath();
                    g.moveTo(x, y);
                    g.lineTo(x + randRange(-2.5, 2.5), y + randRange(6, 22));
                    g.stroke();
                }
                return finishTexture(c, 3);
            }

            /** 돌 / 바위: 얼룩과 이끼 */
            function makeStoneTexture(base, spots) {
                const S = 128;
                const c = makeCanvas(S);
                const g = c.getContext("2d");
                g.fillStyle = base;
                g.fillRect(0, 0, S, S);

                for (let i = 0; i < 160; i++) {
                    const x = rand() * S, y = rand() * S, r = randRange(2, 16);
                    const grd = g.createRadialGradient(x, y, 0, x, y, r);
                    const col = pick(spots);
                    grd.addColorStop(0, col.replace("ALPHA", randRange(0.05, 0.22).toFixed(3)));
                    grd.addColorStop(1, col.replace("ALPHA", "0"));
                    g.fillStyle = grd;
                    g.beginPath();
                    g.arc(x, y, r, 0, Math.PI * 2);
                    g.fill();
                }
                return finishTexture(c, 2);
            }

            /** 나무 재질: 세로 나뭇결 */
            function makeWoodTexture(base, dark) {
                const S = 64;
                const c = makeCanvas(S);
                const g = c.getContext("2d");
                g.fillStyle = base;
                g.fillRect(0, 0, S, S);
                for (let i = 0; i < 120; i++) {
                    g.fillStyle = dark.replace("ALPHA", randRange(0.05, 0.25).toFixed(3));
                    g.fillRect(rand() * S, 0, randRange(0.5, 2.2), S);
                }
                return finishTexture(c, 2);
            }

            /** 안개 판에 쓰는 부드러운 원형 알파 텍스처 */
            function makeMistTexture() {
                const S = 128;
                const c = makeCanvas(S);
                const g = c.getContext("2d");

                g.clearRect(0, 0, S, S);
                for (let i = 0; i < 40; i++) {
                    const x = randRange(20, S - 20), y = randRange(20, S - 20);
                    const r = randRange(14, 46);
                    const grd = g.createRadialGradient(x, y, 0, x, y, r);
                    grd.addColorStop(0, "rgba(255,255,255," + randRange(0.05, 0.16).toFixed(3) + ")");
                    grd.addColorStop(1, "rgba(255,255,255,0)");
                    g.fillStyle = grd;
                    g.beginPath();
                    g.arc(x, y, r, 0, Math.PI * 2);
                    g.fill();
                }

                const t = new THREE.CanvasTexture(c);
                t.wrapS = t.wrapT = THREE.RepeatWrapping;
                t.magFilter = THREE.LinearFilter;
                t.minFilter = THREE.LinearFilter;
                return t;
            }

            // 시대별로 다시 만들어지는 텍스처 캐시
            let TEX = {};

            /******************************************************************
             * POST PROCESSING
             * 저해상도 렌더 타겟 -> 풀스크린 셰이더 -> 저해상도 캔버스 -> CSS 확대
             *
             * 셰이더가 담당하는 것:
             *   - 바랜 사진 같은 채도 저하 + 따뜻한 황갈색 컬러 그레이딩
             *   - 4x4 Bayer 디더링 + 색 단계 축소 (90년대 256색 팔레트 느낌)
             *   - 필름 그레인 / 비네팅 / 미세한 색수차
             *   - 시대 전환용 CRT 글리치
             ******************************************************************/
            let renderTarget, postScene, postCamera, postMaterial;

            // 시대별 그레이딩 값. buildAge()에서 갱신된다.
            const grade = {
                tint: new THREE.Color(1.06, 0.97, 0.80), // 전체 색조
                lift: new THREE.Color(0.045, 0.026, 0.012), // 검정을 갈색으로 들어올림
                sat: 0.58,   // 0=흑백, 1=원본
                sepia: 0.34, // 세피아 혼합량
                contrast: 1.14,
                vignette: 1.0
            };

            const POST_VERT = [
                "varying vec2 vUv;",
                "void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }"
            ].join("\n");

            const POST_FRAG = [
                "precision highp float;",
                "varying vec2 vUv;",
                "uniform sampler2D tDiffuse;",
                "uniform vec2 uRes;",      // 저해상도 픽셀 크기
                "uniform float uTime;",
                "uniform float uGlitch;",  // 0..1 시대 전환
                "uniform vec3 uTint;",
                "uniform vec3 uLift;",
                "uniform float uSat;",
                "uniform float uSepia;",
                "uniform float uContrast;",
                "uniform float uVignette;",

                // 선형 -> sRGB (렌더 타겟은 선형으로 저장된다)
                "vec3 toSRGB(vec3 c){ return pow(clamp(c, 0.0, 1.0), vec3(0.4545)); }",

                "float hash(vec2 p){",
                "  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);",
                "}",

                // 부드러운 값 노이즈 — 수채화 종이의 얼룩진 결에 쓴다
                "float vnoise(vec2 p){",
                "  vec2 i = floor(p), f = fract(p);",
                "  f = f * f * (3.0 - 2.0 * f);",
                "  float a = hash(i);",
                "  float b = hash(i + vec2(1.0, 0.0));",
                "  float c = hash(i + vec2(0.0, 1.0));",
                "  float d = hash(i + vec2(1.0, 1.0));",
                "  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);",
                "}",

                // 2x2 Bayer 를 재귀적으로 4x4 로 확장
                "float bayer2(float x, float y){ return 2.0*x + 3.0*y - 4.0*x*y; }",
                "float bayer4(vec2 p){",
                "  float x = mod(p.x, 4.0), y = mod(p.y, 4.0);",
                "  float fine   = bayer2(mod(x, 2.0), mod(y, 2.0));",
                "  float coarse = bayer2(floor(x * 0.5), floor(y * 0.5));",
                "  return (fine * 4.0 + coarse) / 16.0;",
                "}",

                "void main(){",
                "  vec2 uv = vUv;",
                "  vec2 px = uv * uRes;",

                // --- 시대 전환 글리치: 가로 줄 단위로 화면을 찢는다 ---
                "  if(uGlitch > 0.001){",
                "    float band = floor(uv.y * 34.0);",
                "    float jitter = (hash(vec2(band, floor(uTime * 22.0))) - 0.5);",
                "    float strong = step(0.62, hash(vec2(band * 1.7, floor(uTime * 14.0))));",
                "    uv.x += jitter * 0.10 * uGlitch * (0.35 + strong);",
                "    uv.y += (hash(vec2(floor(uTime*30.0), 3.0)) - 0.5) * 0.015 * uGlitch;",
                "  }",

                // --- 색수차: 화면 바깥쪽으로 갈수록 RGB 가 미세하게 어긋난다 ---
                "  vec2 dir = uv - 0.5;",
                "  float ab = (0.0012 + uGlitch * 0.020);",
                "  vec3 col;",
                "  col.r = texture2D(tDiffuse, uv + dir * ab).r;",
                "  col.g = texture2D(tDiffuse, uv).g;",
                "  col.b = texture2D(tDiffuse, uv - dir * ab).b;",

                "  col = toSRGB(col);",

                // --- 바랜 필름 같은 채도 저하 ---
                "  float lum = dot(col, vec3(0.299, 0.587, 0.114));",
                "  col = mix(vec3(lum), col, uSat);",

                // --- 세피아 / 황갈색 필터 ---
                "  vec3 sepia = lum * vec3(1.18, 0.93, 0.64);",
                "  col = mix(col, sepia, uSepia);",

                // --- 시대별 색조 + 검정 들어올리기 ---
                "  col = col * uTint + uLift;",

                // --- 대비 ---
                "  col = (col - 0.5) * uContrast + 0.5;",

                // --- 수채화 종이 질감: 물감이 번진 듯 밝기가 고르지 않다 ---
                "  float paper = vnoise(uv * vec2(9.0, 6.0)) * 0.6 + vnoise(uv * vec2(29.0, 21.0)) * 0.4;",
                "  col *= 0.93 + paper * 0.14;",

                // --- 비네팅 (오래된 CRT 의 어두운 모서리) ---
                "  float vig = 1.0 - dot(dir, dir) * 1.55 * uVignette;",
                "  col *= mix(0.26, 1.0, clamp(pow(clamp(vig, 0.0, 1.0), 1.30), 0.0, 1.0));",

                // --- 필름 그레인 (저해상도 픽셀 단위라 알갱이가 굵다) ---
                "  float grain = hash(floor(px) + vec2(floor(uTime * 24.0) * 13.7, 0.0));",
                "  col += (grain - 0.5) * 0.055;",

                // --- 아주 약한 수평 주사선 (저해상도 단계) ---
                "  col *= 1.0 - 0.045 * mod(floor(px.y), 2.0);",

                // --- Bayer 디더링 + 색 단계 축소 (256색 시절 그라데이션) ---
                "  float levels = 28.0;",
                "  float d = bayer4(px) - 0.5;",
                "  col = floor(clamp(col, 0.0, 1.0) * levels + 0.5 + d) / levels;",

                // --- 전환 중 화이트 아웃 ---
                "  col = mix(col, vec3(0.99, 0.95, 0.86), uGlitch * 0.18);",

                "  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);",
                "}"
            ].join("\n");

            function initPost() {
                renderTarget = new THREE.WebGLRenderTarget(320, 180, {
                    minFilter: THREE.NearestFilter,
                    magFilter: THREE.NearestFilter,
                    format: THREE.RGBAFormat,
                    type: THREE.UnsignedByteType,
                    depthBuffer: true,
                    stencilBuffer: false
                });

                // 렌더 타겟은 선형으로 두고 셰이더에서 직접 sRGB 변환한다.
                if ("colorSpace" in renderTarget.texture) {
                    renderTarget.texture.colorSpace = THREE.LinearSRGBColorSpace;
                }

                postMaterial = new THREE.ShaderMaterial({
                    vertexShader: POST_VERT,
                    fragmentShader: POST_FRAG,
                    depthTest: false,
                    depthWrite: false,
                    uniforms: {
                        tDiffuse: { value: renderTarget.texture },
                        uRes: { value: new THREE.Vector2(320, 180) },
                        uTime: { value: 0 },
                        uGlitch: { value: 0 },
                        uTint: { value: grade.tint.clone() },
                        uLift: { value: grade.lift.clone() },
                        uSat: { value: grade.sat },
                        uSepia: { value: grade.sepia },
                        uContrast: { value: grade.contrast },
                        uVignette: { value: grade.vignette }
                    }
                });

                postScene = new THREE.Scene();
                postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

                const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial);
                quad.frustumCulled = false; // 클립 공간에 직접 그리므로 컬링하면 안 된다
                postScene.add(quad);
            }

            // 시대가 바뀔 때 그레이딩 유니폼을 갱신
            function applyGrade(g) {
                if (!postMaterial) return;
                const u = postMaterial.uniforms;
                u.uTint.value.setRGB(g.tint[0], g.tint[1], g.tint[2]);
                u.uLift.value.setRGB(g.lift[0], g.lift[1], g.lift[2]);
                u.uSat.value = g.sat;
                u.uSepia.value = g.sepia;
                u.uContrast.value = g.contrast;
                u.uVignette.value = g.vignette;
            }

            /******************************************************************
             * THREE INITIALIZATION
             ******************************************************************/
            function initThree() {
                renderer = new THREE.WebGLRenderer({
                    antialias: false,
                    powerPreference: "high-performance"
                });

                renderer.setPixelRatio(1);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFShadowMap;

                if ("outputColorSpace" in renderer) {
                    // 최종 출력은 셰이더가 직접 만든 sRGB 값을 그대로 내보낸다.
                    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
                }

                dom.game.appendChild(renderer.domElement);

                // CAMERA: 고정 등각(Isometric). 절대 캐릭터 뒤를 따라가지 않는다.
                camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 260);
                camera.position.copy(cameraOffset);
                camera.lookAt(0, 0, 0);

                initPost();

                window.addEventListener("resize", resizeRenderer);
                resizeRenderer();
            }

            function resizeRenderer() {
                // 내부 렌더링 해상도를 낮춰서 굵은 픽셀을 만든다.
                const w = Math.max(320, Math.floor(window.innerWidth * RENDER_SCALE));
                const h = Math.max(200, Math.floor(window.innerHeight * RENDER_SCALE));

                renderer.setSize(w, h, false);
                renderTarget.setSize(w, h);
                postMaterial.uniforms.uRes.value.set(w, h);

                const aspect = window.innerWidth / window.innerHeight;
                camera.left = -VIEW_SIZE * aspect * 0.5;
                camera.right = VIEW_SIZE * aspect * 0.5;
                camera.top = VIEW_SIZE * 0.5;
                camera.bottom = -VIEW_SIZE * 0.5;
                camera.updateProjectionMatrix();
            }

            function setupInput() {
                window.addEventListener("keydown", (e) => {
                    AudioSystem.start();

                    if (MOVE_CODES.has(e.code)) {
                        keys.add(e.code);
                        e.preventDefault();
                    }

                    if (SPRINT_CODES.has(e.code)) {
                        keys.add(e.code);
                    }

                    if (e.code === "KeyE") {
                        if (!e.repeat) tryInteract();
                        e.preventDefault();
                    }

                    // H: 목표 방향 이정표
                    if (e.code === "KeyH") {
                        if (!e.repeat) toggleHint();
                        e.preventDefault();
                    }
                });

                dom.hintBtn.addEventListener("click", () => {
                    AudioSystem.start();
                    toggleHint();
                });

                window.addEventListener("keyup", (e) => {
                    keys.delete(e.code);
                });

                renderer.domElement.addEventListener("pointerdown", (e) => {
                    AudioSystem.start();

                    if (transitioning || demoFinished || e.button !== 0) return;

                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);

                    const point = new THREE.Vector3();
                    if (raycaster.ray.intersectPlane(groundPlane, point)) {
                        clickTarget = new THREE.Vector3(
                            THREE.MathUtils.clamp(point.x, -WORLD_LIMIT, WORLD_LIMIT),
                            0,
                            THREE.MathUtils.clamp(point.z, -WORLD_LIMIT, WORLD_LIMIT)
                        );
                    }
                });
            }

            /******************************************************************
             * 재질 / 기본 도형 생성 헬퍼
             ******************************************************************/
            function makeMat(color, opts = {}) {
                return new THREE.MeshStandardMaterial({
                    color,
                    // 텍스처를 주면 색과 곱해져서 거친 표면 느낌이 난다
                    map: opts.map ?? null,
                    roughness: opts.roughness ?? 0.92,
                    metalness: opts.metalness ?? 0.0,
                    flatShading: opts.flatShading ?? true,
                    transparent: opts.transparent ?? false,
                    opacity: opts.opacity ?? 1,
                    emissive: opts.emissive ?? 0x000000,
                    emissiveIntensity: opts.emissiveIntensity ?? 0,
                    side: opts.side ?? THREE.FrontSide,
                    depthWrite: opts.depthWrite ?? true
                });
            }

            function makeBasicMat(color, opts = {}) {
                return new THREE.MeshBasicMaterial({
                    color,
                    transparent: opts.transparent ?? false,
                    opacity: opts.opacity ?? 1,
                    side: opts.side ?? THREE.FrontSide,
                    depthWrite: opts.depthWrite ?? true
                });
            }

            function setMeshFlags(mesh, opts = {}) {
                mesh.castShadow = opts.castShadow ?? true;
                mesh.receiveShadow = opts.receiveShadow ?? true;
                return mesh;
            }

            function addBox(parent, w, h, d, color, x, y, z, rotY = 0, opts = {}) {
                const mesh = new THREE.Mesh(
                    new THREE.BoxGeometry(w, h, d),
                    opts.material || makeMat(color, opts)
                );
                mesh.position.set(x, y, z);
                mesh.rotation.y = rotY;
                setMeshFlags(mesh, opts);
                parent.add(mesh);
                return mesh;
            }

            function addCylinder(parent, rTop, rBottom, h, segments, color, x, y, z, opts = {}) {
                const mesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(rTop, rBottom, h, segments),
                    opts.material || makeMat(color, opts)
                );
                mesh.position.set(x, y, z);
                setMeshFlags(mesh, opts);
                parent.add(mesh);
                return mesh;
            }

            function addCone(parent, radius, h, segments, color, x, y, z, opts = {}) {
                const mesh = new THREE.Mesh(
                    new THREE.ConeGeometry(radius, h, segments),
                    opts.material || makeMat(color, opts)
                );
                mesh.position.set(x, y, z);
                setMeshFlags(mesh, opts);
                parent.add(mesh);
                return mesh;
            }

            function addBlob(parent, radius, color, x, y, z, opts = {}) {
                const mesh = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(radius, 0),
                    opts.material || makeMat(color, opts)
                );
                mesh.position.set(x, y, z);
                mesh.scale.set(opts.sx ?? 1, opts.sy ?? 1, opts.sz ?? 1);
                mesh.rotation.set(opts.rx ?? 0, opts.ry ?? 0, opts.rz ?? 0);
                setMeshFlags(mesh, opts);
                parent.add(mesh);
                return mesh;
            }

            function addFlatCircle(parent, radius, color, x, y, z, segments = 12, opts = {}) {
                const mesh = new THREE.Mesh(
                    new THREE.CircleGeometry(radius, segments),
                    opts.material || makeMat(color, {
                        ...opts,
                        side: opts.side ?? THREE.DoubleSide
                    })
                );
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(x, y, z);
                mesh.castShadow = opts.castShadow ?? false;
                mesh.receiveShadow = opts.receiveShadow ?? false;
                parent.add(mesh);
                return mesh;
            }

            function addCylinderBetween(parent, a, b, radius, color, opts = {}) {
                const dir = new THREE.Vector3(b.x - a.x, b.y - a.y, b.z - a.z);
                const len = dir.length();
                const mesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(radius, radius, len, opts.segments ?? 6),
                    opts.material || makeMat(color, opts)
                );

                mesh.position.set(
                    (a.x + b.x) * 0.5,
                    (a.y + b.y) * 0.5,
                    (a.z + b.z) * 0.5
                );

                dir.normalize();
                mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
                setMeshFlags(mesh, opts);
                parent.add(mesh);
                return mesh;
            }

            function fadeGroup(group) {
                group.traverse((child) => {
                    if (!child.isMesh || !child.material) return;

                    const fadeOne = (mat) => {
                        const m = mat.clone();
                        m.transparent = true;
                        m.opacity = Math.min(m.opacity ?? 1, 0.36);
                        m.depthWrite = false;
                        if ("emissiveIntensity" in m) m.emissiveIntensity *= 0.18;
                        return m;
                    };

                    child.material = Array.isArray(child.material)
                        ? child.material.map(fadeOne)
                        : fadeOne(child.material);
                });
            }

            /******************************************************************
             * UI / 상호작용
             ******************************************************************/
            function showMessage(text) {
                dom.message.textContent = text;
            }

            function addInventoryItem(name) {
                inventory.push(name);
                updateUI();
            }

            function updateUI() {
                const age = AGE_DATA[currentAge];

                dom.eraText.textContent = age.name;

                let goal = age.goal;
                if (activeGate && activeGate.active) {
                    goal = "깨어난 시간의 문 근처에서 E를 누르세요.";
                }
                if (demoFinished) {
                    goal = "데모 완료";
                }

                dom.objectiveText.textContent = goal;
                dom.countText.textContent = `${ageProgress} / ${age.total}`;

                const visibleItems = inventory.slice(-5);
                for (let i = 0; i < dom.slots.length; i++) {
                    const item = visibleItems[i];
                    dom.slots[i].textContent = item || "";
                    dom.slots[i].classList.toggle("filled", Boolean(item));
                }
            }

            function registerInteractable({
                name,
                description,
                group,
                pickup = true,
                range = 1.75,
                glowColor = 0xffd071
            }) {
                const p = new THREE.Vector3();
                group.getWorldPosition(p);

                const glow = createInteractionGlow(p.x, p.z, glowColor);
                const item = {
                    name,
                    description,
                    group,
                    pickup,
                    range,
                    done: false,
                    glow,
                    position: new THREE.Vector3(p.x, 0, p.z)
                };

                item.marker = addMapMarker(p.x, p.z, "#ffd071", 3, "artifact");

                interactables.push(item);
                return item;
            }

            function createInteractionGlow(x, z, color) {
                const g = new THREE.Group();
                g.position.set(x, terrainHeight(x, z) + 0.08, z);

                const ringMat = makeBasicMat(color, {
                    transparent: true,
                    opacity: 0.75,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });

                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(0.62, 0.025, 5, 24),
                    ringMat
                );
                ring.rotation.x = Math.PI / 2;
                ring.castShadow = false;
                ring.receiveShadow = false;
                g.add(ring);

                const mote = addBlob(g, 0.08, color, 0, 0.55, 0, {
                    material: makeBasicMat(color, { transparent: true, opacity: 0.9 }),
                    castShadow: false,
                    receiveShadow: false
                });

                const light = new THREE.PointLight(color, 0.45, 4);
                light.position.set(0, 0.55, 0);
                g.add(light);

                world.add(g);

                animated.push({
                    type: "glow",
                    group: g,
                    ring,
                    mote,
                    light,
                    baseY: g.position.y,
                    speed: randRange(0.8, 1.25),
                    phase: randRange(0, Math.PI * 2)
                });

                return g;
            }

            function getNearestAction() {
                if (!player) return null;

                let best = null;
                let bestDist = Infinity;

                for (const item of interactables) {
                    if (item.done) continue;

                    const dx = item.position.x - player.position.x;
                    const dz = item.position.z - player.position.z;
                    const d = Math.sqrt(dx * dx + dz * dz);

                    if (d <= item.range && d < bestDist) {
                        bestDist = d;
                        best = { kind: "object", item, distance: d };
                    }
                }

                if (activeGate) {
                    const dx = activeGate.position.x - player.position.x;
                    const dz = activeGate.position.z - player.position.z;
                    const d = Math.sqrt(dx * dx + dz * dz);

                    if (d <= activeGate.range && d < bestDist + 0.25) {
                        best = {
                            kind: activeGate.active ? "gate" : "inactiveGate",
                            gate: activeGate,
                            distance: d
                        };
                    }
                }

                return best;
            }

            function updatePrompt() {
                if (transitioning || demoFinished) {
                    dom.prompt.classList.add("hidden");
                    return;
                }

                const action = getNearestAction();
                if (!action) {
                    dom.prompt.classList.add("hidden");
                    return;
                }

                if (action.kind === "object") {
                    dom.prompt.textContent = "[E] 조사 · " + action.item.name;
                } else if (action.kind === "gate") {
                    dom.prompt.textContent = "[E] 시대 이동";
                } else {
                    dom.prompt.textContent = "[E] 고인돌 확인";
                }

                dom.prompt.classList.remove("hidden");
            }

            function tryInteract() {
                if (transitioning || demoFinished) return;

                const action = getNearestAction();

                if (!action) {
                    showMessage("조사할 대상에 조금 더 가까이 다가가세요.");
                    return;
                }

                if (action.kind === "object") {
                    investigateObject(action.item);
                } else if (action.kind === "gate") {
                    showMessage("고인돌 사이의 푸른빛이 화면을 삼킵니다.\n잊힌 시간의 결을 따라 다음 시대로 이동합니다.");
                    transitionToAge(currentAge + 1);
                } else if (action.kind === "inactiveGate") {
                    AudioSystem.playInvestigate();
                    showMessage("돌 구조물은 아직 차갑게 잠들어 있습니다.\n이 시대에 흩어진 세 흔적을 모두 조사해야 시간의 문이 열릴 것 같습니다.");
                }
            }

            function investigateObject(item) {
                if (item.done) return;

                item.done = true;
                ageProgress++;

                if (item.marker) item.marker.done = true;
                if (item.glow) item.glow.visible = false;
                fadeGroup(item.group);

                AudioSystem.playInvestigate();

                if (item.pickup) {
                    setTimeout(() => AudioSystem.playPickup(), 90);
                }

                addInventoryItem(item.name);

                const extra = handleAgeCompletion();
                showMessage(item.description + (extra ? "\n\n" + extra : ""));
                updateUI();
            }

            function handleAgeCompletion() {
                const age = AGE_DATA[currentAge];

                if (ageProgress < age.total || ageCompleteTriggered) return "";
                ageCompleteTriggered = true;

                if (currentAge === 0) {
                    activateGate();
                    return "세 유물의 기억이 서로 맞물립니다.\n시간의 문이 깨어났습니다.";
                }

                if (currentAge === 1) {
                    activateGate();
                    return "고인돌 제단의 문양과 청동 방울 소리가 하나의 리듬이 됩니다.\n시간의 문이 깨어났습니다.";
                }

                if (currentAge === 2) {
                    AudioSystem.playGate();
                    demoFinished = true;
                    setTimeout(() => {
                        dom.completeOverlay.classList.add("show");
                    }, 800);
                    return "저녁 마을의 기록이 모두 이어졌습니다.\n시간유적의 첫 복원이 완료되었습니다.";
                }

                return "";
            }

            function activateGate() {
                if (!activeGate || activeGate.active) return;

                activeGate.active = true;
                if (activeGate.marker) activeGate.marker.done = true;
                activeGate.portal.visible = true;
                activeGate.ring.visible = true;
                activeGate.portal.material.opacity = 0.34;
                activeGate.ring.material.opacity = 0.95;
                activeGate.light.intensity = 1.35;

                AudioSystem.playGate();
                updateUI();
            }

            /******************************************************************
             * ERA TRANSITION
             * 화면 밝아짐 -> 화이트 플래시 -> 글리치 -> CRT 노이즈
             * -> 어두워짐 -> 새 시대 -> 천천히 밝아짐
             ******************************************************************/
            function transitionToAge(nextAge) {
                if (transitioning) return;

                transitioning = true;
                clickTarget = null;

                AudioSystem.playGlitch();
                playFlash();

                // 셰이더 글리치를 직접 시간축으로 굴린다 (CSS 연출과 겹쳐진다)
                rampGlitch(0, 1, 260, () => {
                    buildAge(nextAge);
                    // 새 시대는 깨진 화면에서 서서히 안정된다
                    rampGlitch(1, 0, 900);
                });
            }

            /** glitchAmount 를 from -> to 로 보간한다 */
            function rampGlitch(from, to, duration, onDone) {
                const startTime = performance.now();

                const step = () => {
                    const k = Math.min(1, (performance.now() - startTime) / duration);
                    // 계단식으로 끊어야 90년대 CRT 처럼 보인다
                    const stepped = Math.floor(k * 9) / 9;
                    glitchAmount = from + (to - from) * stepped;

                    if (k < 1) {
                        requestAnimationFrame(step);
                    } else {
                        glitchAmount = to;
                        if (onDone) onDone();
                    }
                };

                step();
            }

            function playFlash() {
                dom.flash.classList.remove("play");
                dom.glitch.classList.remove("play");
                void dom.flash.offsetWidth;
                dom.flash.classList.add("play");
                dom.glitch.classList.add("play");
            }

            /******************************************************************
             * HINT / 이정표
             * H 키 또는 버튼을 누르면 가장 가까운 조사 대상(혹은 깨어난 시간의 문)
             * 쪽을 가리키는 작은 나무 이정표가 세워지고,
             * 화면 아래에 방향과 거리가 표시된다.
             *
             * 지도를 대신 읽어 주는 장치이지 자동 이동이 아니다.
             ******************************************************************/
            let hintActive = false;
            let hintSign = null;     // 플레이어 옆에 세워지는 3D 이정표
            let hintTimer = null;

            const HINT_DURATION = 9000; // ms

            /** 지금 안내할 목표를 고른다 */
            function getHintTarget() {
                // 1) 아직 조사하지 않은 대상 중 가장 가까운 것
                let best = null, bestDist = Infinity;

                for (const item of interactables) {
                    if (item.done) continue;
                    const d = Math.hypot(
                        item.position.x - player.position.x,
                        item.position.z - player.position.z
                    );
                    if (d < bestDist) {
                        bestDist = d;
                        best = { name: item.name, x: item.position.x, z: item.position.z, distance: d };
                    }
                }

                // 2) 전부 조사했다면 시간의 문
                if (!best && activeGate && activeGate.active) {
                    const d = Math.hypot(
                        activeGate.position.x - player.position.x,
                        activeGate.position.z - player.position.z
                    );
                    best = { name: "시간의 문", x: activeGate.position.x, z: activeGate.position.z, distance: d };
                }

                return best;
            }

            /** 나무 이정표 만들기 (기본 도형 조합) */
            function createSignpost() {
                const g = new THREE.Group();

                // 기둥
                addCylinder(g, 0.045, 0.06, 1.05, 5, 0x6b4826, 0, 0.52, 0, { map: TEX.wood });

                // 방향을 가리키는 판자 (로컬 +Z 를 향한다)
                const board = new THREE.Group();
                board.position.y = 0.92;
                g.add(board);

                addBox(board, 0.62, 0.20, 0.05, 0x8a6534, 0.18, 0, 0, 0, { map: TEX.wood });
                // 화살촉
                const tip = addBox(board, 0.17, 0.17, 0.05, 0x8a6534, 0.55, 0, 0, Math.PI / 4, { map: TEX.wood });
                tip.rotation.z = Math.PI / 4;
                tip.rotation.y = 0;

                // 판자에 새긴 홈
                addBox(board, 0.42, 0.03, 0.02, 0x4a3319, 0.16, 0.04, 0.03);
                addBox(board, 0.34, 0.03, 0.02, 0x4a3319, 0.14, -0.03, 0.03);

                // 발밑의 작은 돌무더기
                for (let i = 0; i < 4; i++) {
                    const a = (i / 4) * Math.PI * 2;
                    addBlob(g, 0.11, 0x7b746c, Math.cos(a) * 0.17, 0.05, Math.sin(a) * 0.17, {
                        sy: 0.5, ry: a, map: TEX.stone, castShadow: false
                    });
                }

                // 은은한 빛 (밤 시대에도 보이도록)
                const light = new THREE.PointLight(0xffc978, 0.5, 3.2);
                light.position.set(0, 1.0, 0);
                g.add(light);

                g.userData.board = board;
                return g;
            }

            function toggleHint() {
                hintActive ? hideHint() : showHint();
            }

            function showHint() {
                if (transitioning || demoFinished || !player) return;

                const target = getHintTarget();
                if (!target) {
                    showMessage("지금은 안내할 곳이 없습니다.");
                    return;
                }

                hintActive = true;
                dom.hintBtn.classList.add("on");
                dom.signpost.classList.add("show");

                // 3D 이정표를 플레이어 바로 옆에 세운다
                if (!hintSign) {
                    hintSign = createSignpost();
                    scene.add(hintSign);
                }
                hintSign.visible = true;

                AudioSystem.playInvestigate();

                // 일정 시간 후 자동으로 사라진다
                clearTimeout(hintTimer);
                hintTimer = setTimeout(hideHint, HINT_DURATION);
            }

            function hideHint() {
                hintActive = false;
                clearTimeout(hintTimer);
                dom.hintBtn.classList.remove("on");
                dom.signpost.classList.remove("show");
                if (hintSign) hintSign.visible = false;
            }

            /** 매 프레임 이정표의 방향과 거리 갱신 */
            function updateHint() {
                if (!hintActive || !player) return;

                const target = getHintTarget();
                if (!target) {
                    hideHint();
                    return;
                }

                const dx = target.x - player.position.x;
                const dz = target.z - player.position.z;
                const dist = Math.hypot(dx, dz);

                // ---- 3D 이정표: 플레이어 옆에 서서 목표를 가리킨다 ----
                if (hintSign) {
                    hintSign.position.set(
                        player.position.x - 1.15,
                        terrainHeight(player.position.x - 1.15, player.position.z + 0.5),
                        player.position.z + 0.5
                    );
                    // 판자가 목표를 향하도록 (로컬 +X 가 화살표 방향)
                    hintSign.userData.board.rotation.y = -Math.atan2(dz, dx);
                }

                // ---- 화면 아래 표시 ----
                // 등각 화면 기준으로 방향을 계산한다.
                // 화면 오른쪽 = 월드 (1,0,-1)/√2, 화면 위쪽 = 월드 -(1,0,1)/√2
                const sx = (dx - dz) * Math.SQRT1_2;
                const syUp = -(dx + dz) * Math.SQRT1_2 * 0.54; // 등각 수직 압축

                const angle = Math.atan2(sx, syUp) * (180 / Math.PI);
                dom.signArrow.style.transform = "rotate(" + angle.toFixed(1) + "deg)";

                dom.signText.innerHTML = "이정표 — <b>" + target.name + "</b>";
                dom.signDist.textContent = "약 " + Math.round(dist * 1.4) + "걸음 · " + compassName(dx, dz);
            }

            /** 월드 방향을 한국식 방위로 (지도의 北 과 같은 기준) */
            function compassName(dx, dz) {
                const names = ["북", "북동", "동", "남동", "남", "남서", "서", "북서"];
                // -Z 를 북으로 둔다
                let a = Math.atan2(dx, -dz) * (180 / Math.PI);
                if (a < 0) a += 360;
                return names[Math.round(a / 45) % 8] + "쪽";
            }

            /******************************************************************
             * MINIMAP
             * 등각 화면과 같은 방향으로 회전한 작은 지도.
             * 화면에서 오른쪽 = 월드 (1,0,-1), 화면에서 위쪽 = 월드 -(1,0,1)
             *
             * mapShapes  : 강 / 연못 같은 면
             * mapMarkers : 건물, 유물, 시간의 문, 지형지물
             ******************************************************************/
            let mapShapes = [];
            let mapMarkers = [];

            const MAP_RANGE = 34; // 지도에 담을 월드 반경

            /** 월드 좌표 -> 미니맵 캔버스 좌표 */
            function worldToMap(x, z, size) {
                const mx = (x - z) * Math.SQRT1_2;
                const my = (x + z) * Math.SQRT1_2;
                const scale = (size * 0.5) / MAP_RANGE;
                return [size * 0.5 + mx * scale, size * 0.5 + my * scale];
            }

            function addMapMarker(x, z, color, size, kind) {
                const marker = { x, z, color, size: size || 2, kind: kind || "prop", done: false };
                mapMarkers.push(marker);
                return marker;
            }

            function addMapShape(points, color) {
                mapShapes.push({ points, color });
            }

            function drawMinimap() {
                const cv = dom.minimap;
                if (!cv) return;

                const ctx = cv.getContext("2d");
                const S = cv.width;

                ctx.clearRect(0, 0, S, S);

                // ---- 바탕 (낡은 종이/가죽 지도) ----
                ctx.fillStyle = "#2a1d12";
                ctx.fillRect(0, 0, S, S);

                // 지도에 낀 얼룩
                ctx.fillStyle = "rgba(122, 90, 48, 0.18)";
                ctx.beginPath();
                ctx.arc(S * 0.32, S * 0.28, S * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(S * 0.72, S * 0.74, S * 0.26, 0, Math.PI * 2);
                ctx.fill();

                // ---- 면 (강, 연못) ----
                for (const shape of mapShapes) {
                    ctx.fillStyle = shape.color;
                    ctx.beginPath();
                    shape.points.forEach((pt, i) => {
                        const [px, py] = worldToMap(pt[0], pt[1], S);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    });
                    ctx.closePath();
                    ctx.fill();
                }

                // ---- 표식 ----
                for (const m of mapMarkers) {
                    const [px, py] = worldToMap(m.x, m.z, S);
                    if (px < -6 || px > S + 6 || py < -6 || py > S + 6) continue;

                    if (m.kind === "artifact") {
                        // 조사 대상은 깜빡이는 마름모
                        const blink = m.done ? 0.22 : 0.65 + Math.sin(clock.elapsedTime * 3.4) * 0.35;
                        ctx.fillStyle = m.done ? "#6a5936" : "#ffd071";
                        ctx.globalAlpha = blink;
                        ctx.save();
                        ctx.translate(px, py);
                        ctx.rotate(Math.PI / 4);
                        ctx.fillRect(-2.5, -2.5, 5, 5);
                        ctx.restore();
                        ctx.globalAlpha = 1;
                    } else if (m.kind === "gate") {
                        // 시간의 문
                        ctx.strokeStyle = m.done ? "#7bdcff" : "#8b8072";
                        ctx.lineWidth = 1.5;
                        ctx.globalAlpha = m.done
                            ? 0.6 + Math.sin(clock.elapsedTime * 4) * 0.4
                            : 0.8;
                        ctx.beginPath();
                        ctx.arc(px, py, 4, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    } else if (m.kind === "building") {
                        ctx.fillStyle = m.color;
                        ctx.fillRect(px - m.size, py - m.size, m.size * 2, m.size * 2);
                        ctx.strokeStyle = "rgba(20,12,6,0.8)";
                        ctx.lineWidth = 1;
                        ctx.strokeRect(px - m.size, py - m.size, m.size * 2, m.size * 2);
                    } else {
                        ctx.fillStyle = m.color;
                        ctx.fillRect(px - m.size * 0.5, py - m.size * 0.5, m.size, m.size);
                    }
                }

                // ---- 플레이어 ----
                if (player) {
                    const [px, py] = worldToMap(player.position.x, player.position.z, S);

                    // 시야 방향 삼각형
                    ctx.save();
                    ctx.translate(px, py);
                    // 월드 회전 -> 지도 회전 보정 (지도는 45도 돌아가 있다)
                    ctx.rotate(-player.rotation.y + Math.PI * 0.75);
                    ctx.fillStyle = "#fff0bd";
                    ctx.beginPath();
                    ctx.moveTo(0, -5);
                    ctx.lineTo(3.2, 3.5);
                    ctx.lineTo(-3.2, 3.5);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();

                    // 주변 시야 원
                    ctx.strokeStyle = "rgba(255, 224, 150, 0.22)";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(px, py, 13, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // ---- 테두리 + 방위 ----
                ctx.strokeStyle = "rgba(190, 145, 72, 0.55)";
                ctx.lineWidth = 1;
                ctx.strokeRect(0.5, 0.5, S - 1, S - 1);

                ctx.fillStyle = "rgba(200, 160, 90, 0.75)";
                ctx.font = "9px monospace";
                ctx.textAlign = "center";
                ctx.fillText("北", S * 0.5, 11);
            }

            /******************************************************************
             * PLAYER
             * 기본 도형만 조합한 작은 로우폴리 인물.
             * 넓은 세계 안에서 아주 작게 보이도록 크기를 억제한다.
             ******************************************************************/
            function createPlayer() {
                const g = new THREE.Group();

                // 바닥에 깔리는 가짜 그림자 (실제 그림자와 함께 무게감을 준다)
                addFlatCircle(g, 0.46, 0x000000, 0, 0.02, 0, 12, {
                    material: makeBasicMat(0x000000, {
                        transparent: true,
                        opacity: 0.45,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    }),
                    castShadow: false,
                    receiveShadow: false
                });

                // ---- 상체 (걸을 때 위아래로 살짝 흔들린다) ----
                const body = new THREE.Group();
                body.position.y = 0.34;
                g.add(body);

                // 가죽옷 몸통
                addCylinder(body, 0.21, 0.27, 0.48, 7, 0x6f9184, 0, 0.24, 0, { map: TEX.cloth });
                // 어깨에 두른 가죽
                addCylinder(body, 0.25, 0.23, 0.13, 7, 0xa5763f, 0, 0.45, 0, { map: TEX.cloth });
                // 목
                addCylinder(body, 0.06, 0.07, 0.07, 5, 0xd8a877, 0, 0.53, 0);
                // 머리
                const head = addBlob(body, 0.16, 0xe3b384, 0, 0.64, 0, { sy: 1.12, sx: 0.94, sz: 0.94 });
                // 머리카락 / 두건
                addCone(body, 0.20, 0.18, 7, 0x4a3122, 0, 0.75, 0);
                // 등짐
                addBox(body, 0.21, 0.25, 0.14, 0x9c6c3f, 0, 0.27, -0.22, 0, { map: TEX.cloth });

                // ---- 팔 (어깨에서 회전하도록 피벗 그룹 사용) ----
                const mkArm = (side) => {
                    const pivot = new THREE.Group();
                    pivot.position.set(side * 0.24, 0.42, 0);
                    body.add(pivot);
                    addCylinder(pivot, 0.055, 0.048, 0.36, 5, 0xd2a271, 0, -0.18, 0);
                    return pivot;
                };

                // ---- 다리 ----
                const mkLeg = (side) => {
                    const pivot = new THREE.Group();
                    pivot.position.set(side * 0.095, 0.0, 0);
                    body.add(pivot);
                    addCylinder(pivot, 0.068, 0.058, 0.34, 5, 0x8a6e52, 0, -0.17, 0);
                    // 발
                    addBox(pivot, 0.11, 0.06, 0.17, 0x3c2c1e, 0, -0.33, 0.03);
                    return pivot;
                };

                g.userData = {
                    body,
                    head,
                    armL: mkArm(-1),
                    armR: mkArm(1),
                    legL: mkLeg(-1),
                    legR: mkLeg(1),
                    walk: 0,     // 걷기 위상
                    moving: 0    // 0..1 이동 여부 보간값
                };

                return g;
            }

            /** 걷기 애니메이션: 팔다리 스윙 + 상체 흔들림 */
            function updatePlayerAnimation(delta, isMoving, t) {
                if (!player) return;
                const u = player.userData;

                // 걷기/멈춤 전환을 부드럽게
                u.moving += ((isMoving ? 1 : 0) - u.moving) * Math.min(1, delta * 11);

                // 달릴 때는 보폭과 속도가 커진다
                const cadence = sprinting ? 14.5 : 9.2;
                const stride = sprinting ? 1.05 : 0.75;

                if (isMoving) u.walk += delta * cadence;

                const swing = Math.sin(u.walk) * stride * u.moving;
                const swing2 = Math.sin(u.walk + Math.PI) * stride * u.moving;

                u.legL.rotation.x = swing;
                u.legR.rotation.x = swing2;
                u.armL.rotation.x = swing2 * 0.7;
                u.armR.rotation.x = swing * 0.7;

                // 걸음마다 몸이 살짝 올라갔다 내려온다
                const bob = Math.abs(Math.sin(u.walk)) * 0.045 * u.moving;
                u.body.position.y = 0.34 + bob;
                u.body.rotation.z = Math.sin(u.walk) * 0.035 * u.moving;
                u.body.rotation.x = (sprinting ? 0.16 : 0.02) * u.moving;

                // 서 있을 때는 아주 느리게 숨쉬는 느낌
                u.head.position.y = 0.64 + Math.sin(t * 1.6) * 0.006 * (1 - u.moving);
            }

            /******************************************************************
             * MOVEMENT
             * WASD / 방향키가 항상 우선. 마우스 클릭 이동도 지원.
             ******************************************************************/
            const prevPos = new THREE.Vector3();
            let sprinting = false;

            function updateMovement(delta) {
                if (!player) return false;

                prevPos.copy(player.position);
                const move = new THREE.Vector3();

                // 등각 시점 기준의 전후좌우
                const forward = new THREE.Vector3();
                camera.getWorldDirection(forward);
                forward.y = 0;
                forward.normalize();

                const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

                if (keys.has("KeyW") || keys.has("ArrowUp")) move.add(forward);
                if (keys.has("KeyS") || keys.has("ArrowDown")) move.sub(forward);
                if (keys.has("KeyD") || keys.has("ArrowRight")) move.add(right);
                if (keys.has("KeyA") || keys.has("ArrowLeft")) move.sub(right);

                let usedDir = null;

                if (move.lengthSq() > 0) {
                    clickTarget = null; // 키 입력이 클릭 이동보다 우선
                    move.normalize();
                    usedDir = move;
                } else if (clickTarget) {
                    const to = new THREE.Vector3(
                        clickTarget.x - player.position.x,
                        0,
