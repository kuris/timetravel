<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>시간유적 — 한국사 탐험 어드벤처</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div id="game"></div>

    <!-- CRT / 오래된 모니터 오버레이 (전부 CSS, 외부 이미지 없음) -->
    <div id="scan"></div>
    <div id="mask"></div>
    <div id="vignette"></div>
    <div id="bezel"></div>

    <div id="ui">
        <!-- 좌측 상단: 시대 / 목표 / 진행 -->
        <div id="topLeft" class="panel">
            <div id="title">시간유적</div>
            <div id="titleRule"></div>
            <div class="stat">현재 시대: <b id="eraText">-</b></div>
            <div class="stat">현재 목표: <b id="objectiveText">-</b></div>
            <div class="stat">조사 진행: <b id="countText">0 / 0</b></div>
            <div class="stat">하늘: <b id="weatherText">-</b></div>
        </div>

        <!-- 우측 상단: 조작 안내 -->
        <div id="controls" class="panel">
            WASD / 방향키: 이동<br>
            Shift: 달리기<br>
            E: 조사 / 획득 / 사용<br>
            H: 이정표 (방향 안내)<br>
            마우스 클릭: 이동
        </div>

        <!-- 미니맵: 등각 화면과 같은 방향으로 회전해서 그린다 -->
        <div id="minimapPanel" class="panel">
            <canvas id="minimap" width="146" height="146"></canvas>
            <div id="minimapLabel">주 변 지 도</div>
        </div>

        <!-- 힌트 버튼: 누르면 목표 방향 이정표가 나타난다 -->
        <div id="hintBtn" class="panel">[H] 이정표</div>

        <!-- 목표 방향 표시 -->
        <div id="signpost" class="panel">
            <div id="signArrow"></div>
            <div>
                <div id="signText">-</div>
                <div id="signDist">-</div>
            </div>
        </div>

        <div id="prompt" class="hidden">[E] 조사</div>
        <div id="message" class="panel">불러오는 중...</div>

        <!-- 유물 5칸 -->
        <div id="inventory">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
        </div>
    </div>

    <div id="flash"></div>
    <div id="glitch"></div>

    <div id="completeOverlay">
        <div id="completeBox" class="panel">
            <h1>시간유적</h1>
            <div class="sub">DEMO COMPLETE</div>
            <p>신석기의 아이가 묻힌 자리를,
여섯 시대의 사람들이 차례로 비껴갔습니다.

성을 쌓을 때도, 길을 낼 때도,
아무도 그 돌을 옮기지 않았습니다.

아무도 기억하지 못했지만,
아무도 잊지 않았습니다.</p>
        </div>
    </div>
    <!-- Three.js 는 전역 THREE 로 먼저 불러온다 (모듈보다 먼저 실행된다) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- 게임 본체 -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
