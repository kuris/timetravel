<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a1008" />
    <title>시간유적 — 한국사 실시간 전략</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/rts.css" />
</head>

<body>
    <div id="game"></div>

    <!-- CRT / 오래된 모니터 오버레이 (전부 CSS, 외부 이미지 없음) -->
    <div id="scan"></div>
    <div id="mask"></div>
    <div id="vignette"></div>
    <div id="bezel"></div>

    <div id="rtsUi">
        <!-- 상단: 자원 -->
        <div id="resBar">
            <div class="res" title="식량"><span class="ico food"></span><b id="vFood">0</b></div>
            <div class="res" title="나무"><span class="ico wood"></span><b id="vWood">0</b></div>
            <div class="res" title="돌"><span class="ico stone"></span><b id="vStone">0</b></div>
            <div class="res" title="금"><span class="ico gold"></span><b id="vGold">0</b></div>
            <div class="res" title="인구"><span class="ico pop"></span><b id="vPop">0/0</b></div>
            <div class="res-gap"></div>
            <div id="quickBar">
                <button class="qb" id="qbHome" title="마을회관으로 (Home)">
                    <span class="ic">⌂</span><span class="tx">회관</span>
                </button>
                <button class="qb" id="qbIdle" title="놀고 있는 주민 찾기 (.)">
                    <span class="ic">주</span><span class="tx">노는 주민</span>
                </button>
                <button class="qb" id="qbEvent" title="마지막 사건이 일어난 자리로 (Space)">
                    <span class="ic">!</span><span class="tx">사건</span>
                </button>
                <button class="qb" id="qbTut" title="안내 열고 닫기 (F1)">
                    <span class="ic">?</span><span class="tx">안내</span>
                </button>
                <button class="qb" id="qbFpv" title="1인칭으로 둘러보기 (V)">
                    <span class="ic">👁</span><span class="tx">1인칭</span>
                </button>
            </div>
            <div class="res" id="ageBadge">신석기 시대</div>
            <div class="res" id="clock">0:00</div>
        </div>

        <!-- 사건 기록 -->
        <div id="eventLog"></div>

        <!-- 가운데 큰 안내 -->
        <div id="bigMsg"></div>

        <!-- 튜토리얼 -->
        <div id="tutPanel">
            <div id="tutHead">
                <span id="tutMark">안 내</span>
                <span id="tutNum">1 / 12</span>
            </div>
            <div id="tutTitle"></div>
            <div id="tutBody"></div>
            <div id="tutGoal"><i></i><span id="tutGoalText"></span></div>
            <button id="tutSkip">이 걸음 건너뛰기</button>
        </div>

        <!-- 1인칭 -->
        <div id="fpvBar">
            <button class="fpvb" id="fpvBack">뒤로</button>
            <div id="fpvHint"></div>
            <button class="fpvb" id="fpvFwd">앞으로</button>
            <button class="fpvb out" id="fpvOut">나가기 (V)</button>
        </div>
        <div id="crosshair"></div>

        <!-- 하단: 조작판 -->
        <div id="cmdBar">
            <div id="panelLeft">
                <div id="portWrap">
                    <div id="portrait"><span id="portGlyph">—</span></div>
                    <div id="portInfo">
                        <div id="portName">—</div>
                        <button id="selClear" title="선택 해제 (Esc)">✕</button>
                        <div id="portOwner"></div>
                        <div id="portHp"><i id="portHpFill"></i></div>
                        <div id="portStats"></div>
                    </div>
                </div>
                <div id="selGrid"></div>
                <div id="groupBar" title="부대 칸 — 비어 있으면 묶고, 차 있으면 부른다"></div>
            </div>

            <div id="panelMid">
                <div id="cmdGrid"></div>
                <div id="queueBar">
                    <div id="queueList"></div>
                    <div id="progWrap"><i id="progFill"></i><span id="progText"></span></div>
                </div>
            </div>

            <div id="panelRight">
                <canvas id="rtsMinimap" width="236" height="166"></canvas>
                <div id="miniRow">
                    <button class="zb" id="zoomOut" title="넓게 보기 (휠 · 두 손가락)">－</button>
                    <div id="miniLabel">주 변 지 도</div>
                    <button class="zb" id="zoomIn" title="가까이 보기 (휠 · 두 손가락)">＋</button>
                </div>
            </div>
        </div>

        <div id="hoverTip"></div>
    </div>

    <div id="selRect"></div>
    <div id="flash"></div>
    <div id="glitch"></div>

    <!-- 시작 / 결과 화면 -->
    <div id="overOverlay">
        <div id="overBox">
            <h1 id="overTitle">시간유적</h1>
            <div class="sub" id="overSub">한국사 실시간 전략</div>
            <p id="overText"></p>
            <div id="overBtns">
                <button id="overBtn">시작</button>
                <button id="overBtn2">튜토리얼</button>
            </div>
        </div>
    </div>

    <!-- Three.js 는 전역 THREE 로 먼저 불러온다 (모듈보다 먼저 실행된다) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- 게임 본체 -->
    <script type="module" src="js/main.js"></script>
</body>

</html>
