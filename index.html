                        clickTarget.z - player.position.z
                    );

                    if (to.length() < 0.15) {
                        clickTarget = null;
                    } else {
                        to.normalize();
                        usedDir = to;
                    }
                }

                if (usedDir) {
                    // Shift: 달리기. 등각 탐험 게임이라 과하지 않게 두 배 이하로.
                    sprinting = keys.has("ShiftLeft") || keys.has("ShiftRight");
                    const speed = PLAYER_SPEED * (sprinting ? SPRINT_MULTIPLIER : 1);

                    player.position.addScaledVector(usedDir, speed * delta);
                    player.position.x = THREE.MathUtils.clamp(player.position.x, -WORLD_LIMIT, WORLD_LIMIT);
                    player.position.z = THREE.MathUtils.clamp(player.position.z, -WORLD_LIMIT, WORLD_LIMIT);

                    // 진행 방향으로 몸을 돌린다 (부드럽게)
                    const target = Math.atan2(usedDir.x, usedDir.z);
                    let diff = target - player.rotation.y;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    player.rotation.y += diff * Math.min(1, delta * 12);
                }

                if (!usedDir) sprinting = false;

                // 물속으로는 들어가지 못한다 (전투도 수영도 없는 게임)
                const h = terrainHeight(player.position.x, player.position.z);
                if (h < -0.42) {
                    player.position.copy(prevPos);
                } else {
                    player.position.y = h;
                }

                return Boolean(usedDir);
            }

            /******************************************************************
             * CAMERA
             * 고정 등각 시점. 회전하지 않고 플레이어를 따라 평행 이동만 한다.
             ******************************************************************/
            function updateCamera(delta, immediate = false) {
                if (!player) return;

                const desired = new THREE.Vector3(player.position.x, 0.6, player.position.z);

                if (immediate) {
                    cameraTarget.copy(desired);
                } else {
                    // 살짝 지연되며 따라가서 "지도를 훑는" 느낌을 준다
                    const t = 1 - Math.pow(0.0025, delta);
                    cameraTarget.lerp(desired, t);
                }

                camera.position.copy(cameraTarget).add(cameraOffset);
                camera.lookAt(cameraTarget);

                // 배경판은 항상 지평선에 붙어 있어야 하므로 카메라를 따라다닌다
                if (backdrop) {
                    backdrop.position.x = cameraTarget.x;
                    backdrop.position.z = cameraTarget.z;
                }

                // 그림자 카메라를 플레이어 주변에 집중시켜 해상도를 아낀다
                if (sunLight) {
                    sunLight.position.set(
                        cameraTarget.x + sunLight.userData.ox,
                        sunLight.userData.oy,
                        cameraTarget.z + sunLight.userData.oz
                    );
                    sunLight.target.position.set(cameraTarget.x, 0, cameraTarget.z);
                    sunLight.target.updateMatrixWorld();
                }
            }

            /******************************************************************
             * ANIMATED OBJECTS
             ******************************************************************/
            function updateAnimated(t, delta) {
                for (const a of animated) {
                    if (a.type === "glow") {
                        a.group.position.y = a.baseY + Math.sin(t * 2.1 * a.speed + a.phase) * 0.07;
                        a.ring.rotation.z += delta * 1.1;
                        a.mote.position.y = 0.50 + Math.sin(t * 3.0 + a.phase) * 0.06;
                        a.light.intensity = 0.32 + Math.sin(t * 2.7 + a.phase) * 0.12;
                    }

                    if (a.type === "wave") {
                        a.mesh.position.x += delta * a.speed;
                        if (a.mesh.position.x > a.maxX) a.mesh.position.x = a.minX;
                    }

                    if (a.type === "torch" || a.type === "lantern") {
                        const f = 0.8 + Math.sin(t * a.speed + a.phase) * 0.22 + randRange(-0.03, 0.03);
                        a.light.intensity = a.baseIntensity * f;
                        a.flame.scale.y = 0.85 + Math.sin(t * a.speed * 1.4 + a.phase) * 0.16;
                    }

                    if (a.type === "ember") {
                        a.mesh.material.opacity = 0.18 + Math.sin(t * 2.8 + a.phase) * 0.05;
                    }

                    // 지면을 스치는 안개: 아주 천천히 흐른다
                    if (a.type === "mist") {
                        a.mesh.position.x += delta * a.speed;
                        a.mesh.position.z += delta * a.speed * 0.45;
                        a.mesh.rotation.z += delta * a.spin;

                        // 너무 멀어지면 반대편으로 되돌린다
                        if (Math.abs(a.mesh.position.x) > 34) a.mesh.position.x *= -1;
                        if (Math.abs(a.mesh.position.z) > 34) a.mesh.position.z *= -1;
                    }

                    // 떠도는 먼지
                    if (a.type === "dust") {
                        const arr = a.geo.attributes.position.array;
                        for (let i = 0; i < arr.length; i += 3) {
                            arr[i] += delta * 0.32;
                            arr[i + 1] += delta * 0.055 * Math.sin(t * 0.7 + i);
                            if (arr[i] > 30) arr[i] = -30;
                            if (arr[i + 1] > 9) arr[i + 1] = 0.3;
                        }
                        a.geo.attributes.position.needsUpdate = true;
                    }

                    // 피어오르는 연기
                    if (a.type === "smoke") {
                        for (let i = 0; i < a.puffs.length; i++) {
                            a.life[i] += delta * 0.20;
                            if (a.life[i] > 1) a.life[i] -= 1;

                            const k = a.life[i];
                            const puff = a.puffs[i];

                            puff.position.set(
                                a.origin.x + Math.sin(k * 5.0 + i) * 0.55 * k,
                                a.origin.y + k * 4.2,
                                a.origin.z + Math.cos(k * 4.1 + i) * 0.45 * k
                            );

                            const sc = 0.5 + k * 2.6;
                            puff.scale.set(sc, sc, sc);
                            // 올라가면서 나타났다가 흩어진다
                            puff.material.opacity = Math.sin(k * Math.PI) * 0.30;
                        }
                    }

                    // 바람에 흔들리는 풀 / 갈대
                    if (a.type === "sway") {
                        a.group.rotation.z = Math.sin(t * a.speed + a.phase) * a.amp;
                        a.group.rotation.x = Math.cos(t * a.speed * 0.7 + a.phase) * a.amp * 0.55;
                    }

                    if (a.type === "gate" && a.gate.active) {
                        a.gate.ring.rotation.z += delta * 1.1;
                        a.gate.portal.material.opacity = 0.27 + Math.sin(t * 3.0) * 0.08;
                        a.gate.light.intensity = 1.15 + Math.sin(t * 4.2) * 0.32;
                    }
                }
            }

            /******************************************************************
             * GAME LOOP
             * 1) 장면을 저해상도 렌더 타겟에 그리고
             * 2) 후처리 셰이더로 그레이딩/디더링/그레인을 입혀 화면에 출력한다.
             ******************************************************************/
            function animate() {
                requestAnimationFrame(animate);

                const delta = Math.min(clock.getDelta(), 0.05);
                const t = clock.elapsedTime;

                let moving = false;
                if (!transitioning && !demoFinished) {
                    moving = updateMovement(delta);
                }

                updatePlayerAnimation(delta, moving, t);
                updateCamera(delta);
                updateAnimated(t, delta);
                updatePrompt();
                updateHint();
                drawMinimap();

                // 후처리 유니폼 갱신
                postMaterial.uniforms.uTime.value = t;
                postMaterial.uniforms.uGlitch.value = glitchAmount;

                // 1단계: 장면 -> 저해상도 렌더 타겟
                renderer.setRenderTarget(renderTarget);
                renderer.clear();
                renderer.render(scene, camera);

                // 2단계: 후처리 -> 화면 (CSS 가 픽셀 단위로 확대)
                renderer.setRenderTarget(null);
                renderer.render(postScene, postCamera);
            }

            /******************************************************************
             * WORLD / 공통 월드 장식
             ******************************************************************/

            /** 0xRRGGBB -> "rgba(r,g,b,ALPHA)" (캔버스 텍스처용 자리표시자) */
            function cssRGBA(hex) {
                const c = new THREE.Color(hex);
                return "rgba(" +
                    Math.round(c.r * 255) + "," +
                    Math.round(c.g * 255) + "," +
                    Math.round(c.b * 255) + ",ALPHA)";
            }

            function cssHex(hex) {
                return "#" + new THREE.Color(hex).getHexString();
            }

            function addLights(age) {
                const l = age.light;

                const hemi = new THREE.HemisphereLight(l.hemiSky, l.hemiGround, l.hemiIntensity);
                scene.add(hemi);

                const ambient = new THREE.AmbientLight(l.ambient, l.ambientIntensity);
                scene.add(ambient);

                const sun = new THREE.DirectionalLight(l.sun, l.sunIntensity);
                sun.position.set(l.sunPos[0], l.sunPos[1], l.sunPos[2]);
                sun.castShadow = true;
                sun.shadow.mapSize.set(1024, 1024);
                sun.shadow.camera.left = -26;
                sun.shadow.camera.right = 26;
                sun.shadow.camera.top = 26;
                sun.shadow.camera.bottom = -26;
                sun.shadow.camera.near = 1;
                sun.shadow.camera.far = 70;
                sun.shadow.bias = -0.0009;
                sun.shadow.normalBias = 0.02;
                scene.add(sun);

                // 그림자 카메라가 플레이어를 따라다니도록 보관
                sun.userData.ox = l.sunPos[0];
                sun.userData.oy = l.sunPos[1];
                sun.userData.oz = l.sunPos[2];
                scene.add(sun.target);
                sunLight = sun;

                // 반대편에서 아주 약하게 채워주는 빛 (완전히 검은 면이 없도록)
                const fill = new THREE.DirectionalLight(l.hemiSky, l.fillIntensity ?? 0.22);
                fill.position.set(-l.sunPos[0], l.sunPos[1] * 0.55, -l.sunPos[2]);
                scene.add(fill);
            }

            /**
             * TERRAIN
             * 커다란 평면을 노이즈로 변형하고, 수채화풍 텍스처 + 정점 색 얼룩을 입힌다.
             */
            function addGround(baseColor, patchColors) {
                const SIZE = 210;
                const SEG = 150;

                const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
                const pos = geo.attributes.position;
                const colors = new Float32Array(pos.count * 3);

                // 정점 색은 색상이 아니라 "밝기/색조 변조" 로 쓴다.
                // 각 패치 색을 최대 채널 기준으로 정규화해서 색조만 남긴다.
                const normalize = (hex) => {
                    const c = new THREE.Color(hex);
                    const m = Math.max(c.r, c.g, c.b) || 1;
                    return c.multiplyScalar(1 / m);
                };

                const base = normalize(baseColor);
                const patch = patchColors.map(normalize);
                const tmp = new THREE.Color();

                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const y = pos.getY(i); // 회전 전이므로 y가 월드 z가 된다

                    // 높이 변형
                    pos.setZ(i, terrainHeight(x, -y));

                    // 큰 얼룩(저주파) + 작은 얼룩(고주파)를 섞어 프리렌더 배경처럼
                    // 저주파가 너무 강하면 위장무늬처럼 보이므로 약하게 쓴다.
                    const macro = fbm(x * 0.055 + 3.1, -y * 0.055 + 5.7, 3);
                    const micro = fbm(x * 0.22 + 19.2, -y * 0.22 + 2.4, 2);

                    // 흰색에서 살짝만 색조 쪽으로 기울인다 (텍스처 색을 죽이지 않도록)
                    tmp.setRGB(1, 1, 1)
                        .lerp(base, 0.22)
                        .lerp(patch[Math.floor(macro * patch.length) % patch.length], 0.20);

                    const shade = 0.70 + macro * 0.52 + micro * 0.22;
                    tmp.multiplyScalar(shade);

                    colors[i * 3] = tmp.r;
                    colors[i * 3 + 1] = tmp.g;
                    colors[i * 3 + 2] = tmp.b;
                }

                geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
                geo.computeVertexNormals();

                const mat = new THREE.MeshStandardMaterial({
                    map: TEX.dirt,
                    vertexColors: true,
                    roughness: 1,
                    metalness: 0,
                    flatShading: false
                });

                const ground = new THREE.Mesh(geo, mat);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                world.add(ground);

                return ground;
            }

            /**
             * BACKDROP
             * 카메라 시선 방향 정면에 세워 두는 프리렌더식 배경판.
             * 카메라가 회전하지 않는 등각 시점이므로 항상 지평선에 붙어 있다.
             */
            function addBackdrop(cfg) {
                backdrop = new THREE.Group();
                scene.add(backdrop);

                // 카메라 시선 방향(수평 성분) — 배경판은 여기에 수직으로 선다.
                const DIR = Math.PI / 4;
                const place = (dist) => ({
                    x: -Math.sin(DIR) * dist,
                    z: -Math.cos(DIR) * dist
                });

                // ---- 하늘 그라데이션 (안개 영향 없음, 가장 뒤) ----
                const skyCanvas = makeCanvas(64);
                const sg = skyCanvas.getContext("2d");
                const grd = sg.createLinearGradient(0, 0, 0, 64);
                grd.addColorStop(0.00, cssHex(cfg.skyTop));
                grd.addColorStop(0.55, cssHex(cfg.skyMid));
                grd.addColorStop(1.00, cssHex(cfg.skyBottom));
                sg.fillStyle = grd;
                sg.fillRect(0, 0, 64, 64);

                // 수평선 부근의 햇무리
                const sun = sg.createRadialGradient(38, 46, 0, 38, 46, 30);
                sun.addColorStop(0, "rgba(255,238,200,0.55)");
                sun.addColorStop(1, "rgba(255,238,200,0)");
                sg.fillStyle = sun;
                sg.fillRect(0, 0, 64, 64);

                const skyTex = new THREE.CanvasTexture(skyCanvas);
                skyTex.magFilter = THREE.LinearFilter;
                if ("colorSpace" in skyTex) skyTex.colorSpace = THREE.SRGBColorSpace;

                const skyPos = place(150);
                const sky = new THREE.Mesh(
                    new THREE.PlaneGeometry(420, 200),
                    new THREE.MeshBasicMaterial({ map: skyTex, fog: false, depthWrite: false })
                );
                sky.position.set(skyPos.x, 44, skyPos.z);
                sky.rotation.y = DIR;
                sky.renderOrder = -10;
                backdrop.add(sky);

                // ---- 산 능선 실루엣 여러 겹 ----
                // 가까운 겹은 진하고, 먼 겹은 안개에 묻힌다.
                cfg.ridges.forEach((r, layer) => {
                    const shape = new THREE.Shape();
                    const width = 360;
                    const steps = 110;

                    shape.moveTo(-width / 2, -40);
                    for (let i = 0; i <= steps; i++) {
                        const t = i / steps;
                        const x = -width / 2 + width * t;
                        // 능선: 여러 주파수를 겹쳐 자연스러운 굴곡을 만든다
                        const h =
                            fbm(x * 0.013 + layer * 31.7, layer * 9.3, 4) * r.height +
                            fbm(x * 0.055 + layer * 12.1, 40 + layer, 3) * r.height * 0.30;
                        shape.lineTo(x, h);
                    }
                    shape.lineTo(width / 2, -40);
                    shape.closePath();

                    const mesh = new THREE.Mesh(
                        new THREE.ShapeGeometry(shape),
                        new THREE.MeshBasicMaterial({
                            color: r.color,
                            transparent: true,
                            opacity: r.opacity,
                            depthWrite: false,
                            fog: true
                        })
                    );

                    const p = place(r.dist);
                    mesh.position.set(p.x, r.base ?? 0, p.z);
                    mesh.rotation.y = DIR;
                    mesh.renderOrder = -9 + layer;
                    backdrop.add(mesh);
                });
            }

            /**
             * 지면을 스치는 안개 띠.
             * 수평 평면 여러 장을 아주 천천히 흘려보낸다.
             */
            function addMistLayers(color, count = 4) {
                for (let i = 0; i < count; i++) {
                    const mesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(80, 80),
                        new THREE.MeshBasicMaterial({
                            map: TEX.mist,
                            color,
                            transparent: true,
                            // 아주 옅게. 화면을 덮으면 안 되고 "결"만 남아야 한다.
                            opacity: randRange(0.035, 0.075),
                            depthWrite: false,
                            blending: THREE.AdditiveBlending,
                            fog: false
                        })
                    );

                    mesh.rotation.x = -Math.PI / 2;
                    mesh.rotation.z = randRange(0, Math.PI * 2);
                    // 지면을 스치듯 낮게 깔린다
                    mesh.position.set(randRange(-16, 16), 0.28 + i * 0.30, randRange(-16, 16));
                    mesh.renderOrder = 6;
                    world.add(mesh);

                    animated.push({
                        type: "mist",
                        mesh,
                        speed: randRange(0.09, 0.26) * (rand() > 0.5 ? 1 : -1),
                        spin: randRange(-0.006, 0.006)
                    });
                }
            }

            /** 공중에 떠도는 먼지 입자 */
            function addDustMotes(color, count = 190) {
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(count * 3);

                for (let i = 0; i < count; i++) {
                    pos[i * 3] = randRange(-30, 30);
                    pos[i * 3 + 1] = randRange(0.3, 9);
                    pos[i * 3 + 2] = randRange(-30, 30);
                }

                geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));

                const points = new THREE.Points(geo, new THREE.PointsMaterial({
                    color,
                    size: 0.075,
                    sizeAttenuation: true,
                    transparent: true,
                    opacity: 0.30,
                    depthWrite: false,
                    fog: true
                }));

                world.add(points);
                animated.push({ type: "dust", points, geo });
            }

            /** 먼 나무 실루엣: 지평선 근처를 채워 준다 */
            function addTreeLine(colors, count, minR, maxR) {
                for (let i = 0; i < count; i++) {
                    const a = randRange(0, Math.PI * 2);
                    const r = randRange(minR, maxR);
                    const x = Math.cos(a) * r;
                    const z = Math.sin(a) * r;
                    if (isNearWater(x, z)) continue; // 강 위에는 나무가 서지 않는다
                    const y = terrainHeight(x, z);

                    const h = randRange(1.9, 3.6);
                    const trunkH = h * 0.34;
                    const col = pick(colors);

                    addCylinder(world, 0.09, 0.15, trunkH, 5, 0x3d2c1c,
                        x, y + trunkH * 0.5, z, { roughness: 1, castShadow: false, receiveShadow: false });

                    // 잎 덩어리를 2~3개 겹쳐 둥글고 낡은 실루엣을 만든다
                    const blobs = Math.floor(randRange(2, 4));
                    for (let b = 0; b < blobs; b++) {
                        addBlob(world, randRange(0.42, 0.72), col,
                            x + randRange(-0.3, 0.3),
                            y + trunkH + h * 0.3 + b * randRange(0.25, 0.42),
                            z + randRange(-0.3, 0.3), {
                            sx: randRange(1.0, 1.5),
                            sy: randRange(0.7, 1.05),
                            sz: randRange(1.0, 1.5),
                            ry: randRange(0, Math.PI),
                            roughness: 1,
                            castShadow: false,
                            receiveShadow: false
                        });
                    }
                }
            }

            /**
             * 흙길 / 돌길: 밟혀서 색이 빠진 자국과 박힌 돌을 깐다.
             * (x1,z1) -> (x2,z2) 를 따라 자연스럽게 구부러진다.
             */
            function addStonePath(x1, z1, x2, z2, width) {
                const steps = Math.floor(Math.hypot(x2 - x1, z2 - z1) * 2.2);

                for (let i = 0; i <= steps; i++) {
                    const t = i / steps;
                    // 약간의 사행(蛇行)을 넣어 직선으로 보이지 않게 한다
                    const wobble = Math.sin(t * Math.PI * 2.4) * width * 0.55;
                    const nx = -(z2 - z1), nz = (x2 - x1);
                    const nl = Math.hypot(nx, nz) || 1;

                    const x = x1 + (x2 - x1) * t + (nx / nl) * wobble;
                    const z = z1 + (z2 - z1) * t + (nz / nl) * wobble;
                    const y = terrainHeight(x, z);

                    // 밟힌 흙 자국
                    addFlatCircle(world, randRange(width * 0.55, width * 0.85), 0x8a6d4b,
                        x, y + 0.02, z, 8, {
                        material: makeMat(0x8a6d4b, {
                            transparent: true,
                            opacity: randRange(0.18, 0.34),
                            side: THREE.DoubleSide,
                            depthWrite: false,
                            roughness: 1,
                            map: TEX.dirtObj
                        })
                    });

                    // 박힌 돌
                    if (rand() > 0.55) {
                        const sx = x + randRange(-width * 0.5, width * 0.5);
                        const sz = z + randRange(-width * 0.5, width * 0.5);
                        const r = randRange(0.1, 0.24);
                        addBlob(world, r, pick([0x8a8279, 0x6d675f, 0x9a9184]),
                            sx, terrainHeight(sx, sz) + r * 0.22, sz, {
                            sx: randRange(1, 1.6),
                            sy: 0.3,
                            sz: randRange(0.9, 1.4),
                            ry: randRange(0, Math.PI),
                            roughness: 1,
                            map: TEX.stone,
                            castShadow: false
                        });
                    }
                }
            }

            /** 작은 연못: 어두운 수면 + 가장자리 돌 + 풀 */
            function addPond(x, z, radius) {
                // 미니맵용 연못 (원을 다각형으로)
                const pts = [];
                for (let i = 0; i < 14; i++) {
                    const a = (i / 14) * Math.PI * 2;
                    pts.push([x + Math.cos(a) * radius, z + Math.sin(a) * radius]);
                }
                addMapShape(pts, "#3a4650");

                const y = terrainHeight(x, z);

                const water = new THREE.Mesh(
                    new THREE.CircleGeometry(radius, 20),
                    new THREE.MeshStandardMaterial({
                        map: TEX.water,
                        color: 0x41505e,
                        transparent: true,
                        opacity: 0.90,
                        // 위와 같은 이유로 거칠게 (연못이 흰 구멍처럼 보이는 것 방지)
                        roughness: 0.88,
                        metalness: 0.0,
                        depthWrite: false
                    })
                );
                water.rotation.x = -Math.PI / 2;
                water.position.set(x, y + 0.035, z);
                water.renderOrder = 1;
                world.add(water);

                // 가장자리 돌
                const count = Math.floor(radius * 7);
                for (let i = 0; i < count; i++) {
                    const a = (i / count) * Math.PI * 2 + randRange(-0.12, 0.12);
                    const r = radius + randRange(-0.15, 0.4);
                    const sx = x + Math.cos(a) * r;
                    const sz = z + Math.sin(a) * r;
                    const sr = randRange(0.12, 0.3);

                    addBlob(world, sr, pick([0x6a655e, 0x7d766c, 0x565149]),
                        sx, terrainHeight(sx, sz) + sr * 0.3, sz, {
                        sx: randRange(1, 1.6),
                        sy: randRange(0.4, 0.8),
                        sz: randRange(0.9, 1.4),
                        ry: a,
                        roughness: 1,
                        map: TEX.stone
                    });
                }
            }

            /**
             * 인스턴싱 산포.
             * 같은 도형 수천 개를 드로우콜 한 번으로 그린다.
             * transforms: [{x,y,z, rx,ry,rz, sx,sy,sz, color}]
             */
            function addInstanced(geometry, material, transforms, opts = {}) {
                if (!transforms.length) return null;

                const mesh = new THREE.InstancedMesh(geometry, material, transforms.length);
                const m = new THREE.Matrix4();
                const q = new THREE.Quaternion();
                const e = new THREE.Euler();
                const pos = new THREE.Vector3();
                const scl = new THREE.Vector3();

                for (let i = 0; i < transforms.length; i++) {
                    const t = transforms[i];
                    e.set(t.rx || 0, t.ry || 0, t.rz || 0);
                    q.setFromEuler(e);
                    pos.set(t.x, t.y, t.z);
                    scl.set(t.sx || 1, t.sy || 1, t.sz || 1);
                    m.compose(pos, q, scl);
                    mesh.setMatrixAt(i, m);
                    if (t.color) mesh.setColorAt(i, t.color);
                }

                mesh.instanceMatrix.needsUpdate = true;
                if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;

                mesh.castShadow = opts.castShadow ?? true;
                mesh.receiveShadow = opts.receiveShadow ?? true;
                // 월드 전체에 퍼져 있으므로 컬링 기준 구를 넉넉히 잡는다
                mesh.frustumCulled = false;

                world.add(mesh);
                return mesh;
            }

            /** 흩어진 돌 / 자갈 (인스턴싱). 지형 높이를 따라간다. */
            function scatterStones(count, minX, maxX, minZ, maxZ, colors) {
                const cols = colors.map((c) => new THREE.Color(c));
                const list = [];

                for (let i = 0; i < count; i++) {
                    const s = randRange(0.07, 0.3);
                    const x = randRange(minX, maxX);
                    const z = randRange(minZ, maxZ);
                    if (isUnderwater(x, z)) continue;

                    list.push({
                        x, y: terrainHeight(x, z) + s * 0.45, z,
                        sx: s * randRange(1, 1.9),
                        sy: s * randRange(0.32, 0.8),
                        sz: s * randRange(0.8, 1.5),
                        ry: randRange(0, Math.PI),
                        rz: randRange(-0.14, 0.14),
                        color: cols[Math.floor(rand() * cols.length)]
                    });
                }

                addInstanced(
                    new THREE.DodecahedronGeometry(1, 0),
                    makeMat(0xffffff, { roughness: 1, map: TEX.stone }),
                    list
                );
            }

            /**
             * 마른 풀 / 잡초 다발 (인스턴싱).
             * 수천 장의 풀잎을 드로우콜 한 번으로 그린다.
             */
            function scatterGrass(count, colors, minR, maxR) {
                const cols = colors.map((c) => new THREE.Color(c));
                const list = [];

                for (let i = 0; i < count; i++) {
                    const a = randRange(0, Math.PI * 2);
                    const r = randRange(minR, maxR);
                    const cx = Math.cos(a) * r;
                    const cz = Math.sin(a) * r;
                    if (isUnderwater(cx, cz)) continue;
                    const cy = terrainHeight(cx, cz);

                    const blades = Math.floor(randRange(3, 7));
                    for (let b = 0; b < blades; b++) {
                        const h = randRange(0.22, 0.62);
                        list.push({
                            x: cx + randRange(-0.22, 0.22),
                            y: cy + h * 0.5,
                            z: cz + randRange(-0.22, 0.22),
                            sx: randRange(0.03, 0.07),
                            sy: h,
                            sz: 0.02,
                            ry: randRange(0, Math.PI),
                            rz: randRange(-0.35, 0.35),
                            rx: randRange(-0.2, 0.2),
                            color: cols[Math.floor(rand() * cols.length)]
                        });
                    }
                }

                addInstanced(
                    new THREE.BoxGeometry(1, 1, 1),
                    makeMat(0xffffff, { roughness: 1 }),
                    list,
                    { castShadow: false, receiveShadow: false }
                );
            }

            /**

             * 여기 색만 바꾸면 그 시대의 땅/돌/지붕 질감이 통째로 바뀐다.

            const TEX_PALETTE = [

                },

                {

                    dirtSpots: [0x816c57, 0x4d4238, 0x77654c, 0x565045, 0x8d7a62],
                    stoneBase: 0x545059,
                    stoneSpots: [0x6b6772, 0x3a373f, 0x4a5246],
                    thatch: [0x8b7449, 0x4d3c22, 0xb09566],
                    wood: [0x4d3620, 0x221609],

            /** 현재 시대의 절차적 텍스처를 모두 새로 굽는다. */
            function buildTextures(index) {
                const p = TEX_PALETTE[index];

                // 텍스처 생성에도 같은 시드를 써서 매번 같은 결과가 나오게 한다
                seedRandom(7000 + index * 911);

                // 오브젝트용 텍스처는 "거의 흰 바탕 + 어두운 결" 이어야 한다.
                // 재질의 color 와 곱해지므로, 텍스처까지 색을 가지면 두 번 어두워진다.
                const GRUNGE = "#e2ddd4";
                const GRUNGE_DARK = "rgba(40,30,20,ALPHA)";
                const GRUNGE_LIGHT = "rgba(255,250,240,ALPHA)";

                TEX = {
                    // 지면용: 실제 흙 색을 가진 유일한 텍스처 (재질 color 는 흰색)
                    dirt: makeTerrainTexture(
                        p.dirtSpots.map(cssRGBA),
                        cssHex(p.dirtBase),
                        { repeat: 26, grit: 38, washes: 150 }
                    ),
                    // 오브젝트용 흙: 색 없이 질감만
                    dirtObj: makeTerrainTexture(
                        [GRUNGE_DARK, GRUNGE_LIGHT, "rgba(90,70,50,ALPHA)"],
                        GRUNGE,
                        { repeat: 2, grit: 22, washes: 70 }
                    ),
                    stone: makeStoneTexture(GRUNGE, [GRUNGE_DARK, GRUNGE_LIGHT, "rgba(70,80,55,ALPHA)"]),
                    thatch: makeThatchTexture("#ded3bd", GRUNGE_DARK, GRUNGE_LIGHT),
                    wood: makeWoodTexture("#dcd2c2", GRUNGE_DARK),
                    water: makeWaterTexture("#cfd6d4", GRUNGE_LIGHT),
                    cloth: makeWoodTexture("#dcd6cc", GRUNGE_DARK),

            }

            function buildAge(index) {
                currentAge = index;
                ageProgress = 0;
                ageCompleteTriggered = false;
                transitioning = false;
                demoFinished = false;
                activeGate = null;
                clickTarget = null;
                interactables = [];
                animated = [];
                mapShapes = [];
                mapMarkers = [];
                hintSign = null;
                hideHint();
                backdrop = null;
                sunLight = null;
                terrainCarve = null;
                glitchAmount = 0;

                dom.completeOverlay.classList.remove("show");

                const age = AGE_DATA[currentAge];

                // ---- 텍스처를 먼저 구워 둔다 (지형/오브젝트가 참조한다) ----
                buildTextures(index);

                // ---- 장면 / 안개 ----
                scene = new THREE.Scene();
                scene.background = new THREE.Color(age.fog);
                scene.fog = new THREE.FogExp2(age.fog, age.fogDensity);

                world = new THREE.Group();
                scene.add(world);

                addLights(age);

                // ---- 프리렌더식 지평선 배경 ----
                seedRandom(4000 + index * 177);
                addBackdrop({
                    skyTop: age.sky.top,
                    skyMid: age.sky.mid,
                    skyBottom: age.sky.bottom,
                    ridges: age.ridges
                });

                // ---- 지형과 오브젝트 ----
                seedRandom(1000 + index * 333);

                if (index === 0) buildNeolithic();
                if (index === 1) buildBronze();
                if (index === 2) buildJoseon();

                // ---- 대기 연출: 지면 안개 + 떠도는 먼지 ----
                addMistLayers(age.fog, index === 2 ? 5 : 4);
                addDustMotes(index === 2 ? 0xb9c4d8 : 0xffe3b4, 140);

                // ---- 후처리 그레이딩 ----
                applyGrade(age.grade);

                // ---- 시대에 맞는 배경음으로 전환 ----
                if (AudioSystem.started) AudioSystem.setEra(index);

                // ---- 플레이어 배치 ----
                player = createPlayer();
                player.position.set(age.start.x, terrainHeight(age.start.x, age.start.z), age.start.z);
                scene.add(player);

                cameraTarget.set(player.position.x, 0.6, player.position.z);
                updateCamera(0, true);
                updateUI();
                showMessage(age.intro + "\n첫 키 입력 또는 클릭 후 소리가 켜집니다.");
            }

            /******************************************************************
             * ERA 1 — 신석기 시대 · 한반도 강가 마을
             *
             * 화면 위쪽(카메라 기준 먼 쪽)으로 넓은 강이 흐르고,
             * 강변 둔덕에 움집 몇 채와 울타리, 화덕이 흩어져 있다.
             * 격자로 정렬하지 않고 일부러 조금씩 어긋나게 배치한다.
             ******************************************************************/

            // 강의 중심선 (등각 화면에서 가로로 흐르도록 45° 회전)
            const RIVER = {
                center: { x: 0, z: -15 },
                rot: Math.PI / 4,
                // 강 쪽으로 파고드는 경계까지의 거리
                bank: 4.0
            };

            /** 강 중심선 기준 수직 거리. 양수 = 뭍, 음수 = 물 */
            function riverPerp(x, z) {
                return (x - RIVER.center.x + z - RIVER.center.z) * Math.SQRT1_2;
            }

            function buildNeolithic() {
                // ---- 강바닥을 파낸다 (지형 생성 전에 등록해야 한다) ----
                terrainCarve = (x, z, h) => {
                    const u = riverPerp(x, z);
                    if (u > RIVER.bank) return h;

                    // 둔덕 -> 얕은 물 -> 깊은 물로 완만하게 내려간다
                    const t = smooth(THREE.MathUtils.clamp((RIVER.bank - u) / 7.5, 0, 1));
                    return h * (1 - t) - t * 1.9;
                };

                // ---- 지면 ----
                addGround(0x9d7249, [0xc59a62, 0x8a7644, 0xb5854f, 0x6f5637, 0xd6b47f]);

                // ---- 강 ----
                addRiver();

                // ---- 강변 갈대밭 ----
                seedRandom(2100);
                for (let i = 0; i < 30; i++) {
                    // 물가를 따라 자라도록 강 중심선 좌표계로 배치한다
                    const along = randRange(-34, 34);
                    const perp = randRange(-1.2, 5.2);
                    const x = RIVER.center.x + along * Math.SQRT1_2 + perp * Math.SQRT1_2;
                    const z = RIVER.center.z - along * Math.SQRT1_2 + perp * Math.SQRT1_2;
                    addReedCluster(x, z, Math.floor(randRange(5, 9)));
                }

                // 마을 안쪽에도 마른 풀 무더기를 흩뿌린다
                scatterGrass(330, [0x8d7b45, 0x6f6a38, 0xa08a4e, 0x5f5c33, 0x7a6b3c], 3, 31);

                // ---- 돌과 자갈 ----
                scatterStones(130, -30, 30, -30, 30, [0x77706a, 0x8b8172, 0x625c55, 0x8f8a74]);

                // 큰 바위 몇 덩이 (구도에 무게를 준다)
                addBoulder(-13.5, 4.0, 1.5);
                addBoulder(-11.2, 6.4, 1.05);
                addBoulder(14.0, -6.5, 1.3);
                addBoulder(-16.5, -3.2, 1.15);

                // ---- 먼 나무 실루엣 ----
                addTreeLine([0x77714a, 0x655f3c, 0x837a52, 0x6d6742], 40, 26, 36);

                // ---- 마을 ----
                // 움집 4채. 각각 크기와 각도를 다르게 해서 정렬감을 없앤다.
                addPitHouse(1.6, 1.2, 0.35, 1.0);
                addPitHouse(5.2, 6.6, -0.65, 1.14);
                addPitHouse(9.4, 3.2, 0.22, 0.88);
                addPitHouse(-1.4, 7.8, 1.05, 0.96);

                // 나무 울타리 (일부러 구부러진 선)
                addFence([
                    [-10.6, -4.2],
                    [-8.1, 1.6],
                    [-6.4, 7.4],
                    [-4.9, 13.6]
                ]);
                addFence([
                    [13.2, 6.0],
                    [12.1, 11.4],
                    [9.4, 15.8]
                ]);

                // 생활 흔적
                addHearth(7.6, 0.4);
                addSmallAltar(11.4, -3.6);
                addStonePile(-11.0, 1.4);
                addShellHeap(-5.6, -6.6);
                addFirewood(3.4, -1.2);
                addFirewood(-2.6, 3.4);
                addDryingRack(-4.2, -2.6, 0.4);

                // ---- 조사 대상 3개 ----
                const pottery = createPotteryShard(-5.0, -5.3);
                registerInteractable({
                    name: "토기",
                    group: pottery,
                    pickup: true,
                    range: 1.9,
                    description: "빗살무늬 토기 조각\n\n오래된 토기의 일부입니다.\n표면에 빗살무늬가 남아 있습니다."
                });

                const stoneTool = createStoneTool(-10.2, 2.2);
                registerInteractable({
                    name: "간석기",
                    group: stoneTool,
                    pickup: true,
                    range: 1.9,
                    description: "간석기\n\n매끈하게 갈아 만든 돌도구입니다.\n신석기인의 생활 흔적을 보여줍니다."
                });

                const burntWood = createBurntWoodArtifact(8.5, 1.4);
                registerInteractable({
                    name: "탄목",
                    group: burntWood,
                    pickup: true,
                    range: 1.9,
                    description: "불탄 나무 조각\n\n오래된 화덕에서 발견된 탄화된 나무입니다.\n이곳에서 사람들이 불을 사용했음을 보여줍니다."
                });

                // ---- 시간의 문 (고인돌) ----
                activeGate = createTimeGate(14.6, 11.0, -Math.PI / 5);
            }

            /** 큰 바위: 여러 덩이를 겹쳐 자연스러운 형태로 만든다 */
            function addBoulder(x, z, scale) {
                addMapMarker(x, z, "#6f6960", 2.5, "prop");
                const y = terrainHeight(x, z);
                const g = new THREE.Group();
                g.position.set(x, y, z);
                g.rotation.y = randRange(0, Math.PI);
                world.add(g);

                const chunks = Math.floor(randRange(3, 6));
                for (let i = 0; i < chunks; i++) {
                    const r = randRange(0.45, 0.85) * scale;
                    addBlob(g, r, pick([0x7b746c, 0x8d8478, 0x655f58]),
                        randRange(-0.5, 0.5) * scale,
                        r * randRange(0.45, 0.8),
                        randRange(-0.5, 0.5) * scale, {
                        sx: randRange(1.0, 1.6),
                        sy: randRange(0.55, 1.0),
                        sz: randRange(0.9, 1.5),
                        ry: randRange(0, Math.PI),
                        rz: randRange(-0.2, 0.2),
                        roughness: 1,
                        map: TEX.stone
                    });
                }
            }

            /**
             * 강: 반투명한 수면 + 흐르는 잔물결 + 물가 자갈.
             * 색은 일부러 파랗지 않게, 탁한 청회색으로 둔다.
             */
            function addRiver() {
                // 미니맵용 강 영역: 중심선 기준 perp <= 3 인 띠
                const along = 60, nearPerp = 3, farPerp = -60;
                const pt = (a, pp) => [
                    RIVER.center.x + a * Math.SQRT1_2 + pp * Math.SQRT1_2,
                    RIVER.center.z - a * Math.SQRT1_2 + pp * Math.SQRT1_2
                ];
                addMapShape([
                    pt(-along, nearPerp), pt(along, nearPerp),
                    pt(along, farPerp), pt(-along, farPerp)
                ], "#3e5257");

                const g = new THREE.Group();
                g.position.set(RIVER.center.x, 0, RIVER.center.z);
                g.rotation.y = RIVER.rot;
                world.add(g);

                // 수면
                const water = new THREE.Mesh(
                    new THREE.PlaneGeometry(160, 70),
                    new THREE.MeshStandardMaterial({
                        map: TEX.water,
                        color: 0x3c4c54,
                        transparent: true,
                        opacity: 0.96,
                        // 직교 카메라에서는 매끈한 수면이 화면 전체에 균일한
                        // 스펙큘러를 만들어 하얗게 타버린다. 일부러 거칠게 둔다.
                        roughness: 0.82,
                        metalness: 0.0,
                        depthWrite: true
                    })
                );
                water.rotation.x = -Math.PI / 2;
                // 수면이 파낸 둔덕(perp <= 3)까지 덮도록 살짝 앞으로 뺀다
                water.position.set(0, -0.14, -32);
                water.receiveShadow = false;
                g.add(water);

                // 수면에 비치는 햇빛 (참조 이미지의 강 반짝임)
                // 넓게 퍼진 반사
                const glare = new THREE.Mesh(
                    new THREE.PlaneGeometry(15, 30),
                    new THREE.MeshBasicMaterial({
                        map: TEX.mist,
                        color: 0xffe6bd,
                        transparent: true,
                        opacity: 0.38,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        fog: true
                    })
                );
                glare.rotation.x = -Math.PI / 2;
                glare.position.set(3, -0.11, -12);
                g.add(glare);

                // 중심의 강한 빛기둥 (참조 이미지의 강 반짝임)
                const glareCore = new THREE.Mesh(
                    new THREE.PlaneGeometry(5.5, 24),
                    new THREE.MeshBasicMaterial({
                        map: TEX.mist,
                        color: 0xfff6e2,
                        transparent: true,
                        opacity: 0.62,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        fog: true
                    })
                );
                glareCore.rotation.x = -Math.PI / 2;
                glareCore.position.set(3, -0.10, -11);
                g.add(glareCore);

                // 잔물결: 가로로 아주 천천히 흐른다
                seedRandom(3300);
                for (let i = 0; i < 130; i++) {
                    const wave = new THREE.Mesh(
                        new THREE.BoxGeometry(randRange(1.0, 5.0), 0.02, 0.06),
                        makeBasicMat(0xffeed2, {
                            transparent: true,
                            opacity: randRange(0.20, 0.46),
                            depthWrite: false
                        })
                    );
                    wave.position.set(randRange(-40, 40), -0.10, randRange(-30, 1));
                    wave.rotation.y = randRange(-0.15, 0.15);
                    wave.castShadow = false;
                    wave.receiveShadow = false;
                    g.add(wave);

                    animated.push({
                        type: "wave",
                        mesh: wave,
                        speed: randRange(0.2, 0.75),
                        minX: -42,
                        maxX: 42
                    });
                }

                // ---- 젖은 모래 띠: 물과 뭍의 경계를 흐린다 ----
                seedRandom(3350);
                for (let i = 0; i < 120; i++) {
                    const along = randRange(-38, 38);
                    const perp = randRange(0.2, 4.6);
                    const x = RIVER.center.x + along * Math.SQRT1_2 + perp * Math.SQRT1_2;
                    const z = RIVER.center.z - along * Math.SQRT1_2 + perp * Math.SQRT1_2;

                    // 물에 가까울수록 진하게 젖어 있다
                    const wet = 1 - THREE.MathUtils.clamp((perp - 0.2) / 4.4, 0, 1);

                    addFlatCircle(world, randRange(1.0, 2.8), 0x6d5a45,
                        x, terrainHeight(x, z) + 0.03, z, 8, {
                        material: makeMat(0x6d5a45, {
                            transparent: true,
                            opacity: 0.12 + wet * 0.34,
                            side: THREE.DoubleSide,
                            depthWrite: false,
                            roughness: 0.55,
                            map: TEX.dirtObj
                        })
                    });
                }

                // ---- 포말선: 물과 뭍이 만나는 밝은 띠 ----
                const foam = new THREE.Mesh(
                    new THREE.PlaneGeometry(150, 3.0),
                    new THREE.MeshBasicMaterial({
                        map: TEX.mist,
                        color: 0xf6e6c8,
                        transparent: true,
                        opacity: 0.45,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        fog: true
                    })
                );
                foam.rotation.x = -Math.PI / 2;
                // 로컬 z 가 곧 강 중심선 기준 perp 거리다
                foam.position.set(0, -0.05, 1.5);
                foam.renderOrder = 3;
                g.add(foam);

                // 물가 자갈 (인스턴싱)
                seedRandom(3400);
                const pebbleCols = [0x8d8579, 0xa2988a, 0x6f685f].map((c) => new THREE.Color(c));
                const pebbles = [];

                for (let i = 0; i < 260; i++) {
                    const along = randRange(-38, 38);
                    const perp = randRange(-2.6, 5.2);
                    const x = RIVER.center.x + along * Math.SQRT1_2 + perp * Math.SQRT1_2;
                    const z = RIVER.center.z - along * Math.SQRT1_2 + perp * Math.SQRT1_2;
                    const sc = randRange(0.07, 0.22);

                    pebbles.push({
                        x, y: terrainHeight(x, z) + sc * 0.4, z,
                        sx: sc * randRange(1, 1.8),
                        sy: sc * randRange(0.3, 0.7),
                        sz: sc * randRange(0.9, 1.4),
                        ry: randRange(0, Math.PI),
                        color: pebbleCols[Math.floor(rand() * pebbleCols.length)]
                    });
                }

                addInstanced(
                    new THREE.DodecahedronGeometry(1, 0),
                    makeMat(0xffffff, { roughness: 1, map: TEX.stone }),
                    pebbles,
                    { castShadow: false }
                );
            }

            /** 갈대 다발: 가늘고 긴 판이 바람에 흔들린다 */
            function addReedCluster(x, z, count = 6) {
                const y = terrainHeight(x, z);

                const g = new THREE.Group();
                g.position.set(x, y, z);
                world.add(g);

                for (let i = 0; i < count; i++) {
                    const h = randRange(0.9, 2.1);
                    const reed = addBox(g,
                        randRange(0.035, 0.075), h, 0.03,
                        pick([0xa8924f, 0x8c7a3c, 0xc0a75f, 0x6f6431]),
                        randRange(-0.45, 0.45), h * 0.5, randRange(-0.45, 0.45),
                        randRange(0, Math.PI), {
                        roughness: 1,
                        castShadow: false,
                        receiveShadow: false
                    });
                    reed.rotation.z = randRange(-0.22, 0.22);

                    // 이삭
                    if (rand() > 0.45) {
                        addBox(g, 0.07, 0.2, 0.05, 0x6e5a2a,
                            reed.position.x, h * 0.98, reed.position.z,
                            reed.rotation.y, { castShadow: false, receiveShadow: false });
                    }
                }

                animated.push({
                    type: "sway",
                    group: g,
                    amp: randRange(0.04, 0.11),
                    speed: randRange(0.6, 1.3),
                    phase: randRange(0, Math.PI * 2)
                });
            }

            /**
             * 움집: 땅을 판 자리 + 흙벽 + 갈대 지붕 + 지붕 뼈대.
             * scale 로 집마다 크기를 다르게 한다.
             */
            function addPitHouse(x, z, rot, scale = 1) {
                const y = terrainHeight(x, z);
                addMapMarker(x, z, "#9c7b45", 3, "building");
                const g = new THREE.Group();
                g.position.set(x, y, z);
                g.rotation.y = rot;
                g.scale.setScalar(scale);
                world.add(g);

                // 집을 두른 흙 둔덕
                addCylinder(g, 1.75, 1.95, 0.14, 12, 0x8a6740, 0, 0.07, 0, {
                    roughness: 1, map: TEX.dirtObj, castShadow: false
                });

                // 흙벽 (살짝 기울여 낡은 느낌)
                const wall = addCylinder(g, 1.14, 1.32, 0.72, 9, 0x9a6d40, 0, 0.42, 0, {
                    roughness: 1, map: TEX.dirtObj
                });
                wall.rotation.z = 0.012;

                // 갈대 지붕: 2단으로 겹쳐 두께를 준다
                addCone(g, 1.62, 0.95, 9, 0xc9a45f, 0, 1.24, 0, { roughness: 1, map: TEX.thatch });
                addCone(g, 1.30, 0.72, 9, 0xb08c4b, 0, 1.62, 0, { roughness: 1, map: TEX.thatch });

                // 꼭대기 묶음
                addCylinder(g, 0.06, 0.12, 0.34, 5, 0x5a4522, 0, 2.02, 0, { map: TEX.wood });

                // 지붕을 누르는 나무 뼈대
                for (let i = 0; i < 5; i++) {
                    const a = (i / 5) * Math.PI * 2 + 0.3;
                    addCylinderBetween(g,
                        new THREE.Vector3(Math.cos(a) * 1.52, 0.80, Math.sin(a) * 1.52),
                        new THREE.Vector3(0, 1.98, 0),
                        0.035, 0x5e4423, { map: TEX.wood, castShadow: false });
                }

                // 입구
                addBox(g, 0.52, 0.56, 0.08, 0x241609, 0, 0.32, 1.22);
                addCylinder(g, 0.05, 0.06, 0.9, 5, 0x60421f, -0.44, 0.47, 1.24, { map: TEX.wood });
                addCylinder(g, 0.05, 0.06, 0.9, 5, 0x60421f, 0.44, 0.47, 1.24, { map: TEX.wood });
                addBox(g, 1.0, 0.07, 0.07, 0x60421f, 0, 0.90, 1.24);

                // 문 앞에 밟힌 흙자국
                addFlatCircle(g, 0.85, 0x7a5734, 0, 0.026, 1.7, 10, {
                    material: makeMat(0x7a5734, {
                        transparent: true, opacity: 0.55, side: THREE.DoubleSide,
                        depthWrite: false, roughness: 1
                    })
                });
            }

            /** 장작더미 */
            function addFirewood(x, z) {
                const y = terrainHeight(x, z);
                const g = new THREE.Group();
                g.position.set(x, y, z);
                g.rotation.y = randRange(0, Math.PI);
                world.add(g);

                for (let i = 0; i < 7; i++) {
                    const len = randRange(0.7, 1.15);
                    const log = addCylinder(g, 0.055, 0.065, len, 5,
                        pick([0x5c3f20, 0x6d4a26, 0x47301a]),
                        randRange(-0.18, 0.18), 0.06 + i * 0.1, randRange(-0.12, 0.12),
                        { map: TEX.wood });
                    log.rotation.z = Math.PI / 2;
                    log.rotation.y = randRange(-0.4, 0.4);
                }
            }

            /** 물고기 말리는 나무 걸이 */
            function addDryingRack(x, z, rot) {
                const y = terrainHeight(x, z);
                const g = new THREE.Group();
                g.position.set(x, y, z);
                g.rotation.y = rot;
                world.add(g);

                addCylinder(g, 0.05, 0.07, 1.25, 5, 0x5e4122, -0.85, 0.62, 0, { map: TEX.wood });
                addCylinder(g, 0.05, 0.07, 1.25, 5, 0x5e4122, 0.85, 0.62, 0, { map: TEX.wood });
                addBox(g, 1.9, 0.06, 0.06, 0x6a4a28, 0, 1.2, 0, 0, { map: TEX.wood });

                // 걸린 가죽/물고기
                for (let i = 0; i < 4; i++) {
                    addBox(g, 0.22, randRange(0.3, 0.5), 0.03,
                        pick([0x8a6b45, 0x6f5436, 0x9b7c52]),
                        -0.6 + i * 0.4, 1.0, 0, randRange(-0.2, 0.2), { map: TEX.cloth });
                }
            }

            function addFence(points) {
                for (let i = 0; i < points.length - 1; i++) {
                    addFenceSegment(points[i][0], points[i][1], points[i + 1][0], points[i + 1][1]);
                }
            }

            /** 울타리 한 구간: 기둥이 조금씩 기울어 낡아 보이게 한다 */
            function addFenceSegment(x1, z1, x2, z2) {
                const dist = Math.hypot(x2 - x1, z2 - z1);
                const posts = Math.max(2, Math.floor(dist / 1.45));

                for (let i = 0; i <= posts; i++) {
                    const t = i / posts;
                    const x = x1 + (x2 - x1) * t + randRange(-0.09, 0.09);
                    const z = z1 + (z2 - z1) * t + randRange(-0.09, 0.09);
                    const y = terrainHeight(x, z);
                    const h = randRange(0.95, 1.25);

                    const post = addCylinder(world, 0.05, 0.08, h, 5,
                        pick([0x5c3d1d, 0x6b4826, 0x4c3218]),
                        x, y + h * 0.5, z, { map: TEX.wood });

                    // 기둥마다 조금씩 다른 방향으로 기울인다
                    post.rotation.z = randRange(-0.09, 0.09);
                    post.rotation.x = randRange(-0.07, 0.07);
                }

                const y1 = terrainHeight(x1, z1);
                const y2 = terrainHeight(x2, z2);

                addCylinderBetween(world,
                    new THREE.Vector3(x1, y1 + 0.52, z1),
                    new THREE.Vector3(x2, y2 + 0.52, z2),
                    0.042, 0x6d4724, { map: TEX.wood });

                addCylinderBetween(world,
                    new THREE.Vector3(x1, y1 + 0.84, z1),
                    new THREE.Vector3(x2, y2 + 0.84, z2),
                    0.036, 0x66421f, { map: TEX.wood });
            }

            /** 화덕: 돌 테두리 + 잉걸불 + 피어오르는 연기 */
            function addHearth(x, z) {
                addMapMarker(x, z, "#d4733a", 2.5, "prop");
                const g = new THREE.Group();
                g.position.set(x, terrainHeight(x, z), z);
                world.add(g);

                addFlatCircle(g, 0.72, 0x2e2520, 0, 0.023, 0, 12, {
                    transparent: true,
                    opacity: 0.72,
                    roughness: 1
                });

                for (let i = 0; i < 9; i++) {
                    const a = (i / 9) * Math.PI * 2;
                    addBlob(g, 0.15, pick([0x6e665e, 0x81776c, 0x5f5a54]),
                        Math.cos(a) * 0.72, 0.11, Math.sin(a) * 0.72,
                        { sx: 1.1, sy: 0.55, sz: 0.9, ry: a }
                    );
                }

                addCylinderBetween(g, new THREE.Vector3(-0.36, 0.13, -0.10), new THREE.Vector3(0.35, 0.13, 0.10), 0.07, 0x241815);
                addCylinderBetween(g, new THREE.Vector3(-0.30, 0.15, 0.18), new THREE.Vector3(0.31, 0.15, -0.17), 0.055, 0x1b1210);

                const ember = addFlatCircle(g, 0.35, 0xff6b24, 0, 0.036, 0, 8, {
                    material: makeBasicMat(0xff6b24, {
                        transparent: true,
                        opacity: 0.22,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    })
                });

                animated.push({ type: "ember", mesh: ember, phase: randRange(0, Math.PI * 2) });

                // 작은 불꽃
                const flame = addCone(g, 0.16, 0.42, 6, 0xff9a3c, 0, 0.26, 0, {
                    material: makeBasicMat(0xff9a3c, { transparent: true, opacity: 0.72, depthWrite: false }),
                    castShadow: false,
                    receiveShadow: false
                });

                const fireLight = new THREE.PointLight(0xff9440, 1.1, 6.5);
                fireLight.position.set(0, 0.5, 0);
                g.add(fireLight);

                animated.push({
                    type: "torch",
                    light: fireLight,
                    flame,
                    baseIntensity: 1.1,
                    speed: randRange(7, 10),
                    phase: randRange(0, Math.PI * 2)
                });

                // 피어오르는 연기 (참조 이미지의 연기 기둥)
                addSmokePlume(g, 0, 0.45, 0);

            /**

            function addSmokePlume(parent, x, y, z) {
                const puffs = [];

                for (let i = 0; i < 9; i++) {
                    const puff = new THREE.Mesh(
                        new THREE.PlaneGeometry(1.1, 1.1),
                        new THREE.MeshBasicMaterial({
                            map: TEX.mist,
                            color: 0xbfae93,
                            transparent: true,
                            opacity: 0,
                            depthWrite: false,
                            fog: true
                        })
                    );

                    // 등각 카메라는 회전하지 않으므로 고정 각도로 세워 두면 항상 정면이다
                    puff.rotation.y = Math.PI / 4;
                    puff.position.set(x, y, z);
                    puff.renderOrder = 5;
                    parent.add(puff);
                    puffs.push(puff);
                }

                animated.push({
                    type: "smoke",
                    puffs,
                    origin: new THREE.Vector3(x, y, z),
                    life: puffs.map((_, i) => i / puffs.length)
                });
            }

                addFlatCircle(g, 0.54, 0x15191f, 0, 0.57, 0, 12, {
                    material: makeBasicMat(0x15191f, { transparent: true, opacity: 0.88, side: THREE.DoubleSide })
                });
                addCylinderBetween(g, new THREE.Vector3(-0.75, 1.05, 0), new THREE.Vector3(0.75, 1.05, 0), 0.055, 0x4d3320);
                addCylinder(g, 0.05, 0.06, 1.0, 6, 0x4d3320, -0.75, 0.55, 0);
                addCylinder(g, 0.05, 0.06, 1.0, 6, 0x4d3320, 0.75, 0.55, 0);
            }

            function addLantern(x, z) {
                addMapMarker(x, z, "#d99a3c", 2, "prop");
                const g = new THREE.Group();
                g.position.set(x, 0, z);
                world.add(g);

                addCylinder(g, 0.04, 0.055, 1.25, 6, 0x3c271b, 0, 0.63, 0);
                addBox(g, 0.36, 0.42, 0.36, 0xffa84e, 0, 1.30, 0, 0, {
                    material: makeBasicMat(0xffa84e, {
                        transparent: true,
                        opacity: 0.78
                    }),
                    castShadow: false,
                    receiveShadow: false
                });

                const flame = addCone(g, 0.13, 0.28, 7, 0xffc45f, 0, 1.32, 0, {
                    material: makeBasicMat(0xffc45f, { transparent: true, opacity: 0.95 }),
                    castShadow: false,
                    receiveShadow: false
                });

                const light = new THREE.PointLight(0xffb066, 2.3, 11);
                light.position.set(0, 1.25, 0);
                g.add(light);

                animated.push({
                    type: "lantern",
                    flame,
                    light,
                    baseIntensity: 2.3,
                    speed: randRange(4.5, 6.0),
                    phase: randRange(0, Math.PI * 2)
                });
            }

            function addJangseung(x, z, rot) {
                addMapMarker(x, z, "#8a6a3f", 2.5, "prop");
                const g = new THREE.Group();
                g.position.set(x, 0, z);
                g.rotation.y = rot;
                world.add(g);

                addCylinder(g, 0.22, 0.28, 1.65, 7, 0x5b3722, 0, 0.83, 0, { roughness: 1 });
                addBlob(g, 0.33, 0x6a3f28, 0, 1.78, 0, { sx: 0.85, sy: 1.12, sz: 0.75 });
                addCone(g, 0.36, 0.30, 7, 0x3b261a, 0, 2.17, 0);

                // 얼굴
                addBox(g, 0.055, 0.055, 0.04, 0x14100d, -0.10, 1.83, 0.25);
                addBox(g, 0.055, 0.055, 0.04, 0x14100d, 0.10, 1.83, 0.25);
                addBox(g, 0.26, 0.04, 0.045, 0x14100d, 0, 1.68, 0.25);

                // 조사 대상인 장승 문양만 별도 그룹으로 반환
                const pattern = new THREE.Group();
                pattern.position.set(0, 1.17, 0.26);
                g.add(pattern);

                const pmat = makeMat(0x74d6ff, {
                    emissive: 0x1d8db6,
                    emissiveIntensity: 0.7,
                    roughness: 0.5
                });
                addBox(pattern, 0.34, 0.04, 0.045, 0x74d6ff, 0, 0.08, 0, 0, { material: pmat });
                addBox(pattern, 0.04, 0.34, 0.045, 0x74d6ff, 0, 0.08, 0, 0, { material: pmat });
                addBox(pattern, 0.24, 0.035, 0.045, 0x74d6ff, 0, -0.08, 0, 0.75, { material: pmat });

                return pattern;
            }

            function createBadgeArtifact(x, z) {
                const g = new THREE.Group();
                g.position.set(x, 0.05, z);
                g.rotation.y = -0.25;
                world.add(g);

                addBox(g, 0.72, 0.16, 0.54, 0x5a3c24, 0, 0.08, 0);
                const gold = makeMat(0xc99b4f, {
                    metalness: 0.15,
                    roughness: 0.55,
                    emissive: 0x241200,
                    emissiveIntensity: 0.08
                });
                addCylinder(g, 0.27, 0.27, 0.07, 8, 0xc99b4f, 0, 0.21, 0, { material: gold });
                addBox(g, 0.28, 0.035, 0.05, 0x704b24, 0, 0.26, 0.01);

                return g;
            }

            function createOldDocument(x, z) {
                const g = new THREE.Group();
                g.position.set(x, 0.05, z);
                g.rotation.y = 0.18;
                world.add(g);

                addBox(g, 1.10, 0.16, 0.72, 0x5b3925, 0, 0.08, 0);
                addBox(g, 0.92, 0.035, 0.55, 0xd9c39a, 0, 0.19, 0, 0, { roughness: 1 });

                addCylinderBetween(g, new THREE.Vector3(-0.50, 0.24, -0.28), new THREE.Vector3(0.50, 0.24, -0.28), 0.035, 0xb69662);
                addCylinderBetween(g, new THREE.Vector3(-0.50, 0.24, 0.28), new THREE.Vector3(0.50, 0.24, 0.28), 0.035, 0xb69662);

                for (let i = 0; i < 4; i++) {
                    addBox(g, 0.60 - i * 0.07, 0.012, 0.025, 0x5b4232, -0.05, 0.215, -0.16 + i * 0.10);
                }

                return g;
            }

            /******************************************************************
             * 시작
             ******************************************************************/
            initThree();
            setupInput();

            // 개발 편의: index.html?era=1 로 특정 시대부터 시작할 수 있다
            const startEra = THREE.MathUtils.clamp(
                parseInt(new URLSearchParams(location.search).get("era"), 10) || 0,
                0, AGE_DATA.length - 1
            );

            buildAge(startEra);
            animate();
        })();
    </script>
</body>
